/* Vstupní dotazník k finančnímu plánu. Otázky odpovídají vstupům živé prezentace (fp.html) – co klient vyplní, jde 1:1 do plánu.

<script>
"use strict";
const EMB=location.hash==="#fp"&&window.parent!==window;
if(EMB)document.body.classList.add("emb");
const DRAFT="fp_dotaznik_draft_v1",ADV="dz_poradce_v1";
/* parametry odkazu jsou za # (prohlížeč je neposílá na server): to = e-mail poradce (schránka), k = veřejný klíč, p/t/e = jméno, telefon, e-mail poradce */
/* parametry: z odkazu za # (dlouhý odkaz), nebo zapečené ve stránce krátkého odkazu (/termin/vk/, /dotaznik/vk/ – window.DZ_LINK, viz tools/short-links.mjs) */
const H=new URLSearchParams(EMB?"":(window.DZ_LINK||location.hash.replace(/^#/,""))),Q=new URLSearchParams(location.search);
/* b = adresa živé kontroly kalendáře (Apps Script poradce, tools/rezervace.gs) – zapečená v odkazu, jinak z dzslots */
const BK_RE=/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
const LINK={to:H.get("to")||"",k:H.get("k")||"",b:BK_RE.test(H.get("b")||"")?H.get("b"):""};
/* výroční schůzka: odkaz s předvyplněnými údaji z posledního plánu – #…&r=<deflate+base64url JSON> (i u krátkého odkazu, kde jsou ostatní parametry zapečené).
   Údaje jsou jen za # – prohlížeč je neposílá na žádný server. Sekce Úspory a investice a Pojištění se skryjí (ty vedeme u nás a máme do nich náhled). */
const RVZ=EMB?"":(new URLSearchParams(location.hash.replace(/^#/,"")).get("r")||"");
let REV=null;   /* {at, id} – načtený výroční dotazník */
async function rvDecode(z){const b=atob(z.replace(/-/g,"+").replace(/_/g,"/")),u=Uint8Array.from(b,c=>c.charCodeAt(0));
  const st=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"));return JSON.parse(await new Response(st).text())}
/* po odeslání „šťouchnout“ poradci push notifikaci (jen obecná zpráva, žádné údaje) – prostředník worker/push.js */
const PUSH_URL="https://zfp-push.kudlicka-vojtech2002.workers.dev";
function pushPing(k){if(!PUSH_URL||!LINK.to)return;try{fetch(PUSH_URL+"/ping",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({to:LINK.to,k}),credentials:"omit",referrerPolicy:"strict-origin",keepalive:true}).catch(()=>{})}catch(e){}}
/* m=r → odkaz jen na rezervaci schůzky (bez dotazníku) */
const ONLY=!EMB&&H.get("m")==="r",ADVN=H.get("p")||"";
if(ONLY){document.title="Rezervace konzultace"+(ADVN?" – "+ADVN:"")+" | ZFP Consulting";const t=document.querySelector(".brand > span");if(t)t.textContent="Rezervace konzultace"}
/* přišel přes krátký odkaz (/dotaznik/vk): v adresním řádku zůstane jen krátký odkaz, klíč se drží v paměti (obnovení stránky znovu načte krátký odkaz) */
(()=>{const c=H.get("s");if(EMB||!c||!/^[a-z0-9-]{1,24}$/.test(c)||!history.replaceState)return;
  try{document.querySelectorAll("picture source[srcset]").forEach(e=>e.srcset=new URL(e.getAttribute("srcset"),location.href).href);
    document.querySelectorAll("img[src]").forEach(e=>e.src=e.src);history.replaceState(null,"",(ONLY?"/termin/":"/dotaznik/")+c)}catch(e){}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NBS=" ";
const fmtIn=v=>{if(v===""||v==null||isNaN(+v))return v==null?"":String(v);const[a,b]=String(v).split(".");const s=a.replace(/\B(?=(\d{3})+(?!\d))/g,NBS);return b!=null?s+","+b:s};
const parseIn=t=>{const c=String(t).replace(/[\s  ]/g,"").replace(",",".");if(c===""||c==="-")return "";const n=+c;return isFinite(n)?n:""};
const get=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split(".");let a=o;ks.slice(0,-1).forEach((k,i)=>{if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]});a[ks.at(-1)]=v};
/* toast stejný jako v Pipeline (ui.css .toast) */
function toast(m){const t=$("#toast");clearTimeout(toast._t);clearTimeout(toast._t2);t.textContent="";const sp=document.createElement("span");sp.textContent=m;t.append(sp);t.hidden=false;t.classList.remove("out");void t.offsetWidth;t.classList.add("in");
  toast._t=setTimeout(()=>{t.classList.remove("in");t.classList.add("out")},3200);toast._t2=setTimeout(()=>{t.hidden=true;t.classList.remove("out")},3500)}
/* potvrzení stejné jako confirmSheet v Pipeline (ui.css .cfm) */
function confirmSheet(text,o={}){return new Promise(res=>{const d=document.createElement("dialog");d.className="cfm";d.setAttribute("role","alertdialog");let done=false;
  d.innerHTML=`<div class="cfm-box"><p class="cfm-t">${esc(text)}</p><div class="cfm-b"><button type="button" class="btn btn--secondary" data-v="0">Zrušit</button><button type="button" class="btn ${o.danger?"btn--danger is-armed":"btn--primary"}" data-v="1">${esc(o.okLabel||"Pokračovat")}</button></div></div>`;
  const fin=v=>{if(done)return;done=true;try{d.close()}catch(e){}d.remove();res(v)};
  d.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)fin(b.dataset.v==="1");else if(e.target===d)fin(false)});d.addEventListener("cancel",e=>{e.preventDefault();fin(false)});

/* ---------- dočasné příjmy: mateřská 28 týdnů (nástup 6 týdnů před porodem → končí ~22 týdnů po porodu);
   rodičovská navazuje, celkem 350 000 Kč, nejdéle do 3 let dítěte (narozené před 2024: do 4 let) ---------- */
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
function docasneDo(r){
  const d=(P.deti||[])[+r.dite];const nar=d&&pd(d.narozen);if(!nar)return null;
  const konecPPM=new Date(nar.getTime()+22*7*864e5);
  if(r.typ==="materska")return {do:ym(konecPPM),why:"mateřská trvá 28 týdnů (od 6. týdne před porodem) – do "+konecPPM.getDate()+". "+(konecPPM.getMonth()+1)+". "+konecPPM.getFullYear()+"; potom obvykle navazuje rodičovská"};
  if(r.typ==="rodicovska"){const lim=new Date(nar);lim.setFullYear(lim.getFullYear()+(nar.getFullYear()>=2024?3:4));
    let end=lim;const c=+r.castka;if(!(c>0))return {do:"",why:"zadejte, kolik vám chodí měsíčně"};if(c>0){const m=Math.ceil(350000/c);const e=new Date(konecPPM);e.setMonth(e.getMonth()+m);if(e<end)end=e}
    return {do:ym(end),why:c>0?(end<lim?"350 000 Kč při "+fmtIn(c)+" Kč měsíčně vystačí do "+(end.getMonth()+1)+"/"+end.getFullYear():"při "+fmtIn(c)+" Kč měsíčně až do "+(nar.getFullYear()>=2024?3:4)+" let dítěte ("+(end.getMonth()+1)+"/"+end.getFullYear()+")"):"zadejte, kolik vám chodí měsíčně"}}
  return null;
}

  else if(!P.vydaje||P.vydaje.vcetne==null)P.vydaje=Object.assign({},P.vydaje,{vcetne:true});   /* výchozí: výdaje včetně všeho */P.klient=Object.assign(blank().klient,P.klient||{});P.kontakt=Object.assign(blank().kontakt,P.kontakt||{});
  P.partner=P.partner||{zapnuto:false};P.renta=P.renta||{mesicne:"",od_veku:""};P.pojisteni=P.pojisteni||{};P.pojisteni.zivotni=P.pojisteni.zivotni||{};
  ["deti","docasne","majetek","nefin","uvery","cile"].forEach(k=>{if(!Array.isArray(P[k]))P[k]=[]});
  if(P.partner.zapnuto)P.klient.bez_partnera=false;
  if(!P.fin||typeof P.fin!=="object")P.fin={};if(!Array.isArray(P.klient.sporty))P.klient.sporty=[];if(P.partner.sporty!=null&&!Array.isArray(P.partner.sporty))P.partner.sporty=[];
  /* nové otázky odvodit z už vyplněných údajů (starší koncepty a plány – nic se nepřepisuje) */
  if(P.kontakt.plan_pro==null){if(P.partner.zapnuto)P.kontakt.plan_pro="dva";else if(P.klient.bez_partnera!=null)P.kontakt.plan_pro="ja"}
  if(EMB&&P.partner.zapnuto&&P.fin.spolecne==null)P.fin.spolecne=true;   /* dosavadní plány páru = společné finance */
  if(P.kontakt.hypo_ma==null&&P.hypo&&P.hypo.zapnuto)P.kontakt.hypo_ma=true;
  ["klient","partner"].forEach(k=>{const o=P[k];if(o&&o.sport_ma==null&&Array.isArray(o.sporty)&&o.sporty.length)o.sport_ma=true;
    if(o&&!o.prace&&EMB){if(+o.zam>0&&+o.podnik>0)o.prace="zam_osvc";else if(+o.zam>0)o.prace="zam";else if(+o.podnik>0)o.prace="osvc"}});
  /* odpovědi Ano/Ne odvodit z už vyplněných seznamů (plán z Pipeline) */
  [["deti_ma","deti"],["docasne_ma","docasne"],["majetek_ma","majetek"],["nefin_ma","nefin"],["uvery_ma","uvery"],["cile_ma","cile"]].forEach(([q,l])=>{if(P.kontakt[q]==null&&P[l].length)P.kontakt[q]=true});
  if(P.kontakt.renta_ma==null&&+P.renta.mesicne>0)P.kontakt.renta_ma=true;if(P.kontakt.zp_ma==null&&+P.pojisteni.zivotni.stav>0)P.kontakt.zp_ma=true;
  if(P.ioldp)Object.keys(P.ioldp).forEach(k=>{if(!FILES[k]&&!P.ioldp[k].pozdeji)delete P.ioldp[k]});}
buttons();
if(EMB){addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=="dz:init")return;load(e.data.plan);render()});parent.postMessage({type:"dz:ready"},location.origin)}
else if(ONLY){sent=true;renderSent();loadSlots()}
else if(RVZ){(async()=>{let pre=null;try{pre=await rvDecode(RVZ)}catch(e){console.warn(e)}
    if(pre&&pre.plan){REV={at:pre.at||0,id:String(pre.at||"")+":"+(pre.plan.klient&&pre.plan.klient.jmeno||"")};SEC=SEC.filter(x=>x.id!=="majetek"&&x.id!=="pojisteni");
      let d=null;try{d=JSON.parse(localStorage.getItem(DRAFT)||"null")}catch(e){}
      load(d&&d.plan&&d.rv===REV.id?d.plan:pre.plan)}
    else toast("Předvyplněné údaje v odkazu se nepodařilo načíst – vyplňte prosím dotazník.");
    render()})()}
else{try{const d=JSON.parse(localStorage.getItem(DRAFT)||"null");if(d&&d.plan&&!d.rv)load(d.plan)}catch(e){}render();
  if(!LINK.k)setTimeout(()=>toast("Odkaz je neúplný – dotazník půjde vyplnit, ale ne odeslat. Požádejte poradce o nový odkaz."),600)}
</script>
<script src="/pipeline/dmy.js?v=1"></script>
