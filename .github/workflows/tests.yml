name: Testy
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Krátké odkazy (termin/, dotaznik/) odpovídají dotazníku
        run: node ../tools/short-links.mjs --check
      - name: Parser sazeb hypoték (tools/sazby.mjs)
        run: node ../tools/sazby.test.mjs
      - name: Test ikon
        run: node tests/icons.run.mjs
      - name: Testy kalkulačky a editoru fotek
        run: node tests/fincalc.run.mjs
      - name: Testy důchodové kalkulačky
        run: node tests/duchod.run.mjs
      - name: Testy záložky Úvěry (dotazník, banky, podklady, nabídky, průběh)
        run: node tests/uvery.run.mjs
      - name: Testy záložky Databáze
        run: node tests/databaze.run.mjs
      - name: Testy souborů u klientů (docs.js)
        run: node tests/docs.run.mjs
      - name: Testy finančního plánu a dotazníku
        run: node tests/fp.run.mjs
      - name: Testy rezervace (volné termíny, kancelář a kolegové, uvolnění zrušené schůzky)
        run: node tests/booking.run.mjs
      - name: Testy kalendáře a SMS potvrzení rezervace (škola, osobní kalendář, šablony)
        run: node tests/kalendar-sms.run.mjs
      - name: Testy veřejné rezervační webovky (/rezervace/ – šifrování, GDPR, žádné cizí požadavky)
        run: node tests/rezervace-web.run.mjs
      - name: Testy odkazů poradců (jméno v náhledu – obrázek, odkazy)
        run: node tests/advimg.run.mjs
      - name: Testy v prohlížeči (celá appka – všechny záložky bez chyb, synchronizace dat)
        run: node tests/run.mjs
        env:
          PP_KEY: ${{ secrets.PP_KEY }}
