name: Sazby hypoték (Hypoindex)
# každé pondělí ráno obnoví pipeline/sazby.json pro kalkulačku Úvěr → „Aktuální úroková sazba“
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Stáhnout Hypoindex a obnovit sazby.json
        run: node tools/sazby.mjs
      - name: Uložit změnu
        run: |
          if git diff --quiet pipeline/sazby.json; then echo "Sazby beze změny"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sazby hypoték: $(node -p "require('./pipeline/sazby.json').period")" pipeline/sazby.json && git push
