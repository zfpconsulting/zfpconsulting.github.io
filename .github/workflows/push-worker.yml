name: Push – prostředník (Cloudflare)
on:
  push:
    branches: [main]
    paths: ["worker/**", "pipeline/pushcrypto.js", ".github/workflows/push-worker.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy prostředníka
        run: node worker/test.mjs
      - name: Nasazení na Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::Chybí secret CLOUDFLARE_API_TOKEN – nasazení přeskakuji (testy prošly)"; exit 0; fi
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Adresa prostředníka: $URL"
          echo "### Prostředník běží: $URL" >> "$GITHUB_STEP_SUMMARY"
          # adresu prostředníka doplnit do Pipeline a dotazníku (jednou, pak už jen při změně)
          [ -z "$URL" ] && exit 0
          cd ..
          sed -i -E "s#const PUSH_URL=\"[^\"]*\";#const PUSH_URL=\"$URL\";#" pipeline/index.html pipeline/dotaznik.html
          sed -i -E "s#https://\*\.workers\.dev#$URL#; s#https://[a-z0-9.-]+\.workers\.dev;#$URL;#" pipeline/dotaznik.html
          if git diff --quiet; then echo "Adresa už v appce je"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Push: adresa prostředníka $URL" && git push
