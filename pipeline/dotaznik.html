<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://firestore.googleapis.com https://zfp-push.kudlicka-vojtech2002.workers.dev; frame-src https://www.google.com https://maps.google.com; form-action 'none'; base-uri 'none'">
<link rel="icon" type="image/png" href="/og/icon.png">
<link rel="apple-touch-icon" href="/og/icon.png">
<title>Vstupní dotazník – finanční plán</title>
<style>
/* Vstupní dotazník k finančnímu plánu. Otázky odpovídají vstupům živé prezentace (fp.html) – co klient vyplní, jde 1:1 do plánu.
   Odkaz pro klienta: koncept se drží jen v tomto prohlížeči; „Odeslat poradci“ dotazník (+ IOLDP) zašifruje veřejným klíčem poradce
   z odkazu (dzcrypto.js) a uloží do schránky – přečte ho jen Pipeline poradce. Bez webových fontů a cizích skriptů (CSP výše).
   V plánu (#fp): otevře se nad prezentací a každá změna se rovnou propíše do plánu klienta. */
:root{--acc:#F37520;--acc-soft:rgba(243,117,32,.10);--bg:#fff;--panel:#fff;--line:#e6e6e6;--line2:#d2d2d2;--txt:#111;--mut:#6f6f6f;--inp:#fff;--chip:#f6f6f6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#0f0f0f;--line:#262626;--line2:#3a3a3a;--txt:#f2f2f2;--mut:#9a9a9a;--inp:#000;--chip:#161616;--acc-soft:rgba(243,117,32,.16)}}
:root[data-theme="dark"]{--bg:#000;--panel:#0f0f0f;--line:#262626;--line2:#3a3a3a;--txt:#f2f2f2;--mut:#9a9a9a;--inp:#000;--chip:#161616;--acc-soft:rgba(243,117,32,.16)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0;padding-top:max(12px,env(safe-area-inset-top))}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand .logo{height:30px;width:auto;display:block}
.brand>span{color:var(--mut);font-weight:500;font-size:14px;border-left:1px solid var(--line2);padding-left:12px}
.top .sp{flex:1}
.prog{height:2px;background:var(--line);max-width:720px;margin:12px auto 0}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.btn{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:10px 16px;cursor:pointer;white-space:nowrap;font-size:14.5px;font-weight:600}
.btn:hover{border-color:var(--txt)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:720px;margin:0 auto;padding:28px 16px 140px}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 8px;font-weight:800;letter-spacing:-.01em}
.hero p{color:var(--mut);margin:0}
.adv{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:22px 0 6px;font-size:14px}
.adv .av{width:40px;height:40px;border-radius:50%;background:var(--txt);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.adv small{display:block;color:var(--mut)}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin:14px 0 0}
.lock svg{flex:none;margin-top:2px}
section{border-bottom:1px solid var(--line);padding:30px 0 32px;scroll-margin-top:80px}
section h2{display:flex;gap:12px;align-items:baseline;font-size:20px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em}
section h2 .n{color:var(--acc);font-size:15px;font-weight:800;min-width:22px;font-variant-numeric:tabular-nums}
section h2 .dn{margin-left:auto;font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.02em}
.why{color:var(--mut);font-size:14px;margin:0 0 18px 34px}
section>.body{margin-left:34px}
@media (max-width:560px){.why,section>.body{margin-left:0}}
h3{font-size:12px;margin:22px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px}
.g .full{grid-column:1/-1}
@media (max-width:560px){.g{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);min-width:0}
label.f .q,.qq{color:var(--txt);font-weight:600;font-size:14.5px}
label.f input,label.f select,label.f textarea{background:var(--inp);border:1px solid var(--line2);border-radius:8px;padding:11px 12px;width:100%;min-width:0;font-size:16px;color:var(--txt);-webkit-appearance:none;appearance:none}
label.f select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f textarea{resize:vertical;min-height:96px}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.money{position:relative}.money input{padding-right:64px!important;text-align:right;font-variant-numeric:tabular-nums}
.money span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
.hint{font-size:12.5px;color:var(--mut)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;border-right:1px solid var(--line2);background:var(--inp);padding:10px 22px;cursor:pointer;font-size:14.5px;font-weight:600;min-width:80px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--txt);color:var(--bg)}
.ask{margin:4px 0 14px}
.ask .qq{display:block;margin-bottom:8px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{border:1px solid var(--line);border-radius:10px;padding:14px;position:relative;background:var(--panel)}
.row>b{font-size:14px;display:block;margin:0 70px 10px 0}
.row .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--mut);cursor:pointer;font-size:13px;padding:6px 8px;border-radius:6px}
.row .x:hover{color:var(--txt)}
.add{margin-top:12px;width:100%;border:1px dashed var(--line2);background:none;border-radius:10px;padding:13px;color:var(--txt);font-weight:600;cursor:pointer}
.add:hover{border-color:var(--acc);color:var(--acc)}
.who{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:22px 0 10px}
.who:first-child{margin-top:0}
.calc{font-size:12.5px;color:var(--acc);font-weight:600}
.file{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0}
.file .nm{flex:1;min-width:160px;font-size:14px}
.file .nm small{display:block;color:var(--mut);font-size:12.5px}
.file .ok{color:var(--acc);font-weight:700}
.err{border-color:var(--acc)!important;box-shadow:0 0 0 3px var(--acc-soft)!important}
.seg.err{box-shadow:0 0 0 3px var(--acc-soft)}
.emsg{display:block;font-size:12.5px;color:var(--acc);font-weight:600;margin-top:2px}
.banner{position:sticky;top:64px;z-index:5;background:var(--txt);color:var(--bg);border-radius:10px;padding:12px 14px;font-size:14px;margin:16px 0 0;display:flex;gap:12px;align-items:center}
.banner b{color:var(--acc)}
.banner button{margin-left:auto;border:0;background:var(--acc);color:#fff;border-radius:6px;padding:7px 12px;font-weight:700;cursor:pointer;white-space:nowrap}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));z-index:10}
.bottom .in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center}
.bottom .st{flex:1;font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--txt);color:var(--bg);padding:11px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.priv{font-size:12.5px;color:var(--mut);margin:26px 0 0;line-height:1.55}
.lnk{border:1px solid var(--line);border-radius:10px;padding:14px;margin:18px 0 0}
.lnk .g{margin-top:10px}
.done{text-align:center;padding:60px 10px}
.done .ic{width:64px;height:64px;border-radius:50%;background:var(--acc);display:inline-flex;align-items:center;justify-content:center;margin-bottom:18px}
.done h1{font-size:26px;margin:0 0 8px}
.done p{color:var(--mut);max-width:440px;margin:0 auto}
body.emb .hero h1{font-size:22px}
.book{max-width:640px;margin:8px auto 0;text-align:left}
.book h2{font-size:22px;margin:0 0 6px;font-weight:800}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.days button{flex:none;border:1px solid var(--line2);background:var(--inp);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:center;min-width:72px;font-size:13px;line-height:1.3}
.days button b{display:block;font-size:16px}
.days button.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:6px 0 16px}
.times button{border:1px solid var(--line2);background:var(--inp);border-radius:8px;padding:10px 0;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.times button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.map{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0 6px}
.map iframe{display:block;width:100%;height:240px;border:0}
.note{border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;font-size:14.5px}
</style>
</head>
<body>
<div class="top"><div class="in"><span class="brand"><picture><source srcset="zfp-logo-white.svg" media="(prefers-color-scheme: dark)"><img src="zfp-logo.svg" alt="ZFP GROUP" class="logo"></picture><span>Vstupní dotazník</span></span><span class="sp"></span><span id="topBtns"></span></div><div class="prog"><i id="prog"></i></div></div>
<main id="main"></main>
<div class="bottom" id="bottom"><div class="in"><span class="st" id="st"></span><span id="botBtns"></span></div></div>
<div class="toast" id="toast"></div>
<script src="dzcrypto.js?v=2"></script>
<script>
"use strict";
const EMB=location.hash==="#fp"&&window.parent!==window;
if(EMB)document.body.classList.add("emb");
const DRAFT="fp_dotaznik_draft_v1",ADV="dz_poradce_v1";
/* parametry odkazu jsou za # (prohlížeč je neposílá na server): to = e-mail poradce (schránka), k = veřejný klíč, p/t/e = jméno, telefon, e-mail poradce */
const H=new URLSearchParams(EMB?"":location.hash.replace(/^#/,"")),Q=new URLSearchParams(location.search);
const LINK={to:H.get("to")||"",k:H.get("k")||""};
/* po odeslání „šťouchnout“ poradci push notifikaci (jen obecná zpráva, žádné údaje) – prostředník worker/push.js */
const PUSH_URL="https://zfp-push.kudlicka-vojtech2002.workers.dev";
function pushPing(k){if(!PUSH_URL||!LINK.to)return;try{fetch(PUSH_URL+"/ping",{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({to:LINK.to,k}),credentials:"omit",referrerPolicy:"strict-origin",keepalive:true}).catch(()=>{})}catch(e){}}
/* m=r → odkaz jen na rezervaci schůzky (bez dotazníku) */
const ONLY=!EMB&&H.get("m")==="r",ADVN=H.get("p")||"";
if(ONLY){document.title="Rezervace konzultace"+(ADVN?" – "+ADVN:"")+" | ZFP GROUP";const t=document.querySelector(".brand > span");if(t)t.textContent="Rezervace konzultace"}
/* přišel přes krátký odkaz (/dotaznik/vk): v adresním řádku zůstane jen krátký odkaz, klíč se drží v paměti (obnovení stránky znovu načte krátký odkaz) */
(()=>{const c=H.get("s");if(EMB||!c||!/^[a-z0-9-]{1,24}$/.test(c)||!history.replaceState)return;
  try{document.querySelectorAll("picture source[srcset]").forEach(e=>e.srcset=new URL(e.getAttribute("srcset"),location.href).href);
    document.querySelectorAll("img[src]").forEach(e=>e.src=e.src);history.replaceState(null,"",(ONLY?"/termin/":"/dotaznik/")+c)}catch(e){}})();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NBS=" ";
const fmtIn=v=>{if(v===""||v==null||isNaN(+v))return v==null?"":String(v);const[a,b]=String(v).split(".");const s=a.replace(/\B(?=(\d{3})+(?!\d))/g,NBS);return b!=null?s+","+b:s};
const parseIn=t=>{const c=String(t).replace(/[\s  ]/g,"").replace(",",".");if(c===""||c==="-")return "";const n=+c;return isFinite(n)?n:""};
const get=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);
const set=(o,p,v)=>{const ks=p.split(".");let a=o;ks.slice(0,-1).forEach((k,i)=>{if(a[k]==null)a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]});a[ks.at(-1)]=v};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),3200)}

/* stejné číselníky jako v plánu (fp.html) */
const TYPY=["Běžný účet","Spořicí účet","Termínovaný vklad","Stavební spoření","Penzijní připojištění (PP)","Doplňkové penzijní spoření (DPS)","Podílový fond (OPF)","ETF","Akcie / dluhopisy (přímé)","Životní pojištění (ŽP)","Jiné"];
const NEFIN=["Nemovitost k bydlení","Investiční nemovitost","Pozemek","Rekreační objekt","Podíl ve firmě","Auto","Umění / sbírky","Jiné"];
const UVERY=["Hypotéka","Úvěr ze stavebního spoření","Spotřebitelský úvěr","Leasing","Kreditní karta / kontokorent","Podnikatelský úvěr","Jiný"];
const DOC=[["materska","Peněžitá pomoc v mateřství (mateřská)"],["rodicovska","Rodičovský příspěvek (rodičovská)"],["vyzivne","Výživné"],["jine","Jiný příjem, který skončí"]];
const STAV=[["","Vyberte…"],["svobodny","svobodný / svobodná"],["zenaty","ženatý / vdaná"],["partner","žijeme s partnerem / partnerkou"],["rozvedeny","rozvedený / rozvedená"],["vdovec","vdovec / vdova"]];
const ESSZ="https://eportal.cssz.cz/web/portal/-/sluzby/informativni-duchodova-aplikace";
const blank=()=>({klient:{jmeno:"",narozen:"",zam:"",podnik:"",pasiv:"",pronajem:"",bonus:"",hruba:"",vydaje_osobni:"",vydaje_dom:"",povolani:"",sport:""},partner:{zapnuto:false},kontakt:{telefon:"",email:"",stav:""},
  deti:[],motivace:"",docasne:[],majetek:[],nefin:[],uvery:[],cile:[],renta:{mesicne:"",od_veku:""},pojisteni:{zivotni:{stav:""}},poznamka:""});
let P=blank();
const FILES={};          /* IOLDP: jen v paměti (do konceptu se neukládá) */
let tried=false,sending=false,sent=false;
const ma=()=>!!(P.partner&&P.partner.zapnuto);
const ppl=()=>["klient"].concat(ma()?["partner"]:[]);
const pNm=k=>{const o=k==="klient"?P.klient:P.partner;return ((o&&o.jmeno)||"").split(" ")[0]||(k==="klient"?"Vy":"Partner / partnerka")};
const K=()=>P.kontakt=P.kontakt||{};

/* ---------- dočasné příjmy: mateřská 28 týdnů (nástup 6 týdnů před porodem → končí ~22 týdnů po porodu);
   rodičovská navazuje, celkem 350 000 Kč, nejdéle do 3 let dítěte (narozené před 2024: do 4 let) ---------- */
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null};
function docasneDo(r){
  const d=(P.deti||[])[+r.dite];const nar=d&&pd(d.narozen);if(!nar)return null;
  const konecPPM=new Date(nar.getTime()+22*7*864e5);
  if(r.typ==="materska")return {do:ym(konecPPM),why:"mateřská trvá 28 týdnů (od 6. týdne před porodem) – do "+konecPPM.getDate()+". "+(konecPPM.getMonth()+1)+". "+konecPPM.getFullYear()+"; potom obvykle navazuje rodičovská"};
  if(r.typ==="rodicovska"){const lim=new Date(nar);lim.setFullYear(lim.getFullYear()+(nar.getFullYear()>=2024?3:4));
    let end=lim;const c=+r.castka;if(!(c>0))return {do:"",why:"zadejte, kolik vám chodí měsíčně"};if(c>0){const m=Math.ceil(350000/c);const e=new Date(konecPPM);e.setMonth(e.getMonth()+m);if(e<end)end=e}
    return {do:ym(end),why:c>0?(end<lim?"350 000 Kč při "+fmtIn(c)+" Kč měsíčně vystačí do "+(end.getMonth()+1)+"/"+end.getFullYear():"při "+fmtIn(c)+" Kč měsíčně až do "+(nar.getFullYear()>=2024?3:4)+" let dítěte ("+(end.getMonth()+1)+"/"+end.getFullYear()+")"):"zadejte, kolik vám chodí měsíčně"}}
  return null;
}

/* ---------- pole ---------- */
const em=p=>tried&&MISS.has(p)?`<span class="emsg">${esc(MISS.get(p))}</span>`:"";
const ec=p=>tried&&MISS.has(p)?" err":"";
const money=(q,p,o={})=>`<label class="f ${o.full?"full":""}"><span class="q">${q}</span><span class="money"><input class="${ec(p)}" data-p="${p}" data-num="1" inputmode="numeric" autocomplete="off" value="${esc(fmtIn(get(P,p)))}" placeholder="${esc(o.ph||"")}"><span>${o.u||"Kč/měs"}</span></span>${o.h?`<span class="hint">${o.h}</span>`:""}${em(p)}</label>`;
const num=(q,p,o={})=>`<label class="f ${o.full?"full":""}"><span class="q">${q}</span><input class="${ec(p)}" data-p="${p}" data-num="1" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(get(P,p)))}" placeholder="${esc(o.ph||"")}">${o.h?`<span class="hint">${o.h}</span>`:""}${em(p)}</label>`;
const txt=(q,p,o={})=>`<label class="f ${o.full?"full":""}"><span class="q">${q}</span><input class="${ec(p)}" data-p="${p}" type="${o.type||"text"}" ${o.ac?`autocomplete="${o.ac}"`:""} ${o.im?`inputmode="${o.im}"`:""} value="${esc(get(P,p)==null?"":get(P,p))}" placeholder="${esc(o.ph||"")}">${o.h?`<span class="hint">${o.h}</span>`:""}${em(p)}</label>`;
const area=(q,p,o={})=>`<label class="f full"><span class="q">${q}</span><textarea class="${ec(p)}" data-p="${p}" rows="${o.rows||4}" placeholder="${esc(o.ph||"")}">${esc(get(P,p)||"")}</textarea>${o.h?`<span class="hint">${o.h}</span>`:""}${em(p)}</label>`;
const sel=(q,p,opts,o={})=>{const v=get(P,p);return `<label class="f ${o.full?"full":""}"><span class="q">${q}</span><select class="${ec(p)}" data-p="${p}">${opts.map(x=>{const[val,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(val)===String(v==null?"":v)?"selected":""}>${esc(t)}</option>`}).join("")}</select>${o.h?`<span class="hint">${o.h}</span>`:""}${em(p)}</label>`};
const chk=(t,p)=>`<label class="chk"><input type="checkbox" data-p="${p}" ${get(P,p)?"checked":""}><span>${t}</span></label>`;

const TITLES={};
function rows(path,blankRow,title,fields){const L=get(P,path)||[];TITLES[path]=title;

  [["deti_ma","deti"],["docasne_ma","docasne"],["majetek_ma","majetek"],["nefin_ma","nefin"],["uvery_ma","uvery"],["cile_ma","cile"]].forEach(([q,l])=>{if(P.kontakt[q]==null&&P[l].length)P.kontakt[q]=true});
  if(P.kontakt.renta_ma==null&&+P.renta.mesicne>0)P.kontakt.renta_ma=true;if(P.kontakt.zp_ma==null&&+P.pojisteni.zivotni.stav>0)P.kontakt.zp_ma=true;
  if(P.ioldp)Object.keys(P.ioldp).forEach(k=>{if(!FILES[k]&&!P.ioldp[k].pozdeji)delete P.ioldp[k]});}
buttons();
if(EMB){addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=="dz:init")return;DZ=e.data.dz||null;load(e.data.plan);render()});parent.postMessage({type:"dz:ready"},location.origin)}
else if(ONLY){sent=true;renderSent();loadSlots()}
else{try{const d=JSON.parse(localStorage.getItem(DRAFT)||"null");if(d&&d.plan)load(d.plan)}catch(e){}render();
  if(!LINK.k)setTimeout(()=>toast("Odkaz je neúplný – dotazník půjde vyplnit, ale ne odeslat. Požádejte poradce o nový odkaz."),600)}
</script>
