<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanční plán – živá prezentace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f5;--panel:#ffffff;--line:#e2e2e6;--txt:#1c1c1f;--mut:#6b6b74;--acc:#E8722A;--inp:#fff;--chip:#f0f0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--panel:#18181a;--line:#2b2b2f;--txt:#ececee;--mut:#9a9aa3;--inp:#121214;--chip:#222226}}
:root[data-theme="dark"]{--bg:#0f0f10;--panel:#18181a;--line:#2b2b2f;--txt:#ececee;--mut:#9a9aa3;--inp:#121214;--chip:#222226}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 Lato,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;font-weight:900;white-space:nowrap}
.top h1 b{color:var(--acc)}
.top select{max-width:220px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sp{flex:1}
.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:0;height:calc(100vh - 57px)}
.ed{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 12px 40px}
.view{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"▾";color:var(--mut)}
details:not([open]) summary::after{content:"▸"}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0}
.g.one{grid-template-columns:1fr}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--txt);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.rows{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.row{display:grid;gap:6px;align-items:end;background:var(--chip);border-radius:8px;padding:6px}
.row .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px}
.add{font-size:12px;color:var(--acc);background:none;border:1px dashed var(--line);border-radius:7px;padding:6px;cursor:pointer;width:100%}
.hint{font-size:12px;color:var(--mut);margin:4px 0}
.flags{font-size:12px;margin:0;padding-left:16px;color:var(--mut)}
.flags li{margin:3px 0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.steps{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:-8px;background:var(--panel);z-index:5;padding:8px 0 8px;margin:0 0 4px;border-bottom:1px solid var(--line)}
.steps button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.steps button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.steps .sn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:rgba(127,127,127,.2);align-items:center;justify-content:center;font-size:11px}
.steps .bd{background:#DF6A6A;color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:16px}
.chkbox details{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin:8px 0;background:var(--chip)}
.miss{list-style:none;margin:4px 0 6px;padding:0;display:flex;flex-direction:column;gap:3px}
.miss button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12.5px}
.miss button span{color:var(--acc);white-space:nowrap}
.miss button:hover{border-color:var(--acc)}
.stepnav{display:flex;justify-content:space-between;margin:14px 0}
.flash{outline:3px solid var(--acc)!important;outline-offset:1px;transition:outline-color .3s}
/* náhled */
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .cnt{color:var(--mut);font-size:13px}
.stageBox{position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:6px;padding:0;background:#111;cursor:pointer;width:128px;height:72px;overflow:hidden;position:relative}
.thumbs button.on{border-color:var(--acc)}
.thumbs .tl{position:absolute;inset:auto 0 0 0;font-size:10px;background:rgba(0,0,0,.6);color:#ddd;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs .mini{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(.08);transform-origin:0 0;pointer-events:none}
/* prezentační režim */
.present{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;cursor:pointer}
.present.on{display:flex}
.present .pbox{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden}
.present .pc{position:absolute;right:14px;bottom:10px;color:#666;font-size:12px;z-index:5;cursor:default}
.present .px{position:absolute;right:12px;top:10px;z-index:5;background:rgba(255,255,255,.08);color:#aaa;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}

/* ================= SLIDY (design 1600×900) ================= */
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.sl{position:absolute;inset:0;background:#161616;color:#efefef;font-family:Lato,system-ui,sans-serif;overflow:hidden;transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1)}
.sl.enter{opacity:0;transform:translateX(60px)}
.sl.leave{opacity:0;transform:translateX(-60px)}
.sl .bar{position:absolute;left:0;top:0;width:100%;height:13px;background:#E8722A}
.sl .logo{position:absolute;right:72px;top:62px;width:110px}
.sl h2{position:absolute;left:80px;top:40px;margin:0;font-size:46px;font-weight:900;letter-spacing:-.5px}
.sl .sub{position:absolute;left:80px;top:122px;font-size:20px;color:#b4b4b4}
.o{color:#E8722A}.mut{color:#b4b4b4}.grn{color:#4FB389}.red{color:#DF6A6A}
.card{position:absolute;background:#202020;border:1px solid #2e2e2e;border-radius:10px}
.k{transition:all .9s cubic-bezier(.2,.8,.2,1)}
@property --p1{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --p2{syntax:'<percentage>';inherits:false;initial-value:0%}
.dn{border-radius:50%;background:conic-gradient(#E8722A 0 var(--p1),#5b8dd6 0 var(--p2),#8a8a8a 0);-webkit-mask:radial-gradient(circle,transparent 57%,#000 57.5%);mask:radial-gradient(circle,transparent 57%,#000 57.5%);transition:--p1 1.3s cubic-bezier(.2,.8,.2,1),--p2 1.3s cubic-bezier(.2,.8,.2,1)}
table.t{position:absolute;border-collapse:collapse;font-size:17px}
table.t th{background:#2a2a2a;color:#cfcfcf;font-weight:700;text-align:right;padding:10px 12px;font-size:14px;text-transform:uppercase;letter-spacing:.3px}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:10px 12px;border-bottom:1px solid #2c2c2c;text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:900;border-top:1px solid #444}
.pill{display:inline-block;padding:5px 14px;border-radius:4px;color:#fff;font-weight:900;font-size:14px;letter-spacing:.4px}
.node{position:absolute;border-radius:50%;transition:all .9s cubic-bezier(.2,.8,.2,1)}
.nl{position:absolute;text-align:center;transition:all .9s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.foot{position:absolute;left:80px;right:80px;bottom:22px;font-size:12.5px;color:#8a8a8a;line-height:1.35}
.shot{position:absolute;border:2px dashed #555;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#888;font-size:16px;overflow:hidden;background:#1d1d1d}
.shot img{width:100%;height:100%;object-fit:contain}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.ed{max-height:none;border-right:0;border-bottom:1px solid var(--line)}.view{padding:16px}}
@media print{
  body{background:#fff}.top,.wrap{display:none!important}
  .print{display:block!important}
  .pp{width:297mm;height:167.06mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp .stage{transform:scale(.70157)}
  @page{size:297mm 167.06mm;margin:0}
}
.print{display:none}
</style>
</head>
<body>
<div class="top">
  <h1>Finanční plán <b>živě</b></h1>
  <select id="cli" aria-label="Klient"></select>
  <button class="btn" id="bNew">+ Nový klient</button>
  <button class="btn" id="bDup">Duplikovat</button>
  <button class="btn" id="bDel">Smazat</button>
  <span class="sp"></span>
  <button class="btn" id="bImp">Import</button>
  <button class="btn" id="bExp">Export</button>
  <button class="btn" id="bPdf">PDF</button>
  <button class="btn pri" id="bPres">▶ Prezentovat</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
</div>
<div class="wrap">
  <aside class="ed" id="ed"></aside>
  <main class="view">
    <div class="nav">
      <button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button>
      <span class="cnt" id="cnt"></span><span class="sp"></span>
      <span class="cnt">Změna vstupu vlevo = okamžitý přepočet. Prezentace: ←/→, mezerník, klik; Esc konec.</span>
    </div>
    <div class="stageBox" id="box"><div class="stage" id="stage"></div></div>
    <div class="thumbs" id="thumbs"></div>
  </main>
</div>
<div class="present" id="pres"><div class="pbox" id="pbox"><div class="stage" id="pstage"></div></div><button class="px" id="px">✕ Esc</button><div class="pc" id="pc"></div></div>
<div class="print" id="print"></div>

<script>/* FP engine — výpočet finančního plánu (metodika ZFP / VK). Čistá funkce compute(inp, today). */
(function (root, f) { const E = f(); if (typeof module === "object" && module.exports) module.exports = E; else root.FPE = E; })(this, function () {
"use strict";
const ALOK = { 0: [0, 0, 100], 5: [29, 62, 9], 10: [54, 43, 3], 15: [74, 24, 2], 20: [85, 13, 2], 25: [90, 8, 2], 30: [93, 7, 0] };
const MES = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const MES2 = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const n0 = v => (v !== "" && v != null && isFinite(+v) ? +v : 0);
const ceil = (v, s) => Math.ceil(v / s - 1e-9) * s;
const floorTo = (v, s) => Math.floor(v / s + 1e-9) * s;
function alok(y) {
  y = Math.max(0, Math.min(30, y)); const k = Object.keys(ALOK).map(Number);
  for (let i = 0; i < k.length - 1; i++) { const a = k[i], b = k[i + 1]; if (y >= a && y <= b) { const t = (y - a) / (b - a), A = Math.round(ALOK[a][0] + t * (ALOK[b][0] - ALOK[a][0])), D = Math.round(ALOK[a][1] + t * (ALOK[b][1] - ALOK[a][1])); return [A, D, 100 - A - D]; } }
  return ALOK[30];
}
const mr = r => Math.pow(1 + r, 1 / 12) - 1;
function parseDate(s) { if (!s) return null; if (s instanceof Date) return s; const m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/.exec(String(s)); if (!m) return null; return new Date(+m[1], +m[2] - 1, +(m[3] || 1)); }
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
const yearsBetween = (a, b) => (b - a) / (365.25 * 864e5);
function pvAnn(m, years, r) { const n = Math.round(years * 12); if (n <= 0 || m <= 0) return 0; const q = mr(r); return m * (1 - Math.pow(1 + q, -n)) / q; }
function duchVek(rocnik) { if (rocnik <= 1965) return 65; if (rocnik >= 1971) return 67; return 65 + (rocnik - 1965) / 3; }
/* nemocenská 2026 (zák. 187/2006, redukční hranice 2026), čistá → hrubá odhadem */
const RH = [1633, 2449, 4897];
function netFromGross(g) { const soc = g * 0.071, zdr = g * 0.045, tax = Math.max(0, g * 0.15 - 2570); return g - soc - zdr - tax; }
function grossFromNet(n) { let lo = 0, hi = 1e6; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (netFromGross(m) < n) lo = m; else hi = m; } return lo; }
function nemocenska(hruba) {
  const d = hruba * 12 / 365, r = Math.min(d, RH[0]) * 0.9 + Math.max(0, Math.min(d, RH[1]) - RH[0]) * 0.6 + Math.max(0, Math.min(d, RH[2]) - RH[1]) * 0.3;
  return { d15: Math.round(r * 0.6 * 30), d31: Math.round(r * 0.66 * 30), d61: Math.round(r * 0.72 * 30) };
}
function pct100(vals) { const t = vals.reduce((a, b) => a + Math.max(0, b), 0); if (t <= 0) return vals.map(() => 0); const raw = vals.map(v => Math.max(0, v) / t * 100), fl = raw.map(Math.floor); let rest = 100 - fl.reduce((a, b) => a + b, 0); raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, i]) => fl[i]++); return fl; }

/* ---------------- produkty: třída s=[akcie, dluhopisy, hotovost] %, výnos nominálně p.a., vstupní poplatek, správa p.a. ---------------- */
const WI_EQ = [["sp500","S&P 500"],["svetove","Světové"],["evropa","Evropa"],["rozvojove","Rozvíjející se trhy"],["dividendove","Dividendové"],["technologicke","Technologické"],["zdravotnictvi","Zdravotnictví a farmacie"],["ziva","Živá planeta"],["px","Pražská burza (PX)"],["blockchain","Blockchain"]];
const PRODUKTY = [
  { k: "cq_akc", n: "Conseq akciové portfolio", g: "Conseq", s: [100, 0, 0], vynos: 0.10, vstup: 0.03, sprava: 0 },
  { k: "cq_dip", n: "Conseq akciové portfolio – DIP", g: "Conseq", s: [100, 0, 0], vynos: 0.10, vstup: 0.03, sprava: 0, dip: 1 },
  { k: "cq_dluh", n: "Conseq dluhopisové portfolio", g: "Conseq", s: [0, 100, 0], vynos: 0.048, vstup: 0.03, sprava: 0 },
  { k: "zfpi", n: "ZFPI Realitní fond", g: "ZFP Investments", s: [0, 100, 0], vynos: 0.0515, vstup: 0.03, sprava: 0, prir: 1 },
  { k: "wi_rez", n: "ZFP WI – Investiční rezerva", g: "ZFP WI", s: [0, 0, 100], vynos: 0.035, vstup: 0, sprava: 0.005 },
  { k: "wi_konz", n: "ZFP WI – Konzervativní", g: "ZFP WI", s: [20, 80, 0], vynos: 0.06, vstup: 0.03, sprava: 0.0199 },
  { k: "wi_dluh", n: "ZFP WI – Dluhopisové", g: "ZFP WI", s: [0, 100, 0], vynos: 0.05, vstup: 0.03, sprava: 0.0099 },
  { k: "wi_vyv", n: "ZFP WI – Vyvážené", g: "ZFP WI", s: [50, 50, 0], vynos: 0.075, vstup: 0.03, sprava: 0.0199 },
  { k: "wi_dyn", n: "ZFP WI – Dynamické", g: "ZFP WI", s: [80, 20, 0], vynos: 0.09, vstup: 0.03, sprava: 0.0199 },
  ...WI_EQ.map(([k, n]) => ({ k: "wi_" + k, n: "ZFP WI – " + n, g: "ZFP WI", s: [100, 0, 0], vynos: 0.10, vstup: 0.03, sprava: 0.0199 })),
  { k: "premium", n: "ZFP Premium Avant (FKI)", g: "AVANT", s: [0, 100, 0], vynos: 0.07, vstup: 0.02, sprava: 0 },
  { k: "zfpf", n: "ZFP Finance", g: "ZFP Finance", s: [0, 100, 0], vynos: 0.08, vstup: 0, sprava: 0, nofee: 1 },
  { k: "auv", n: "Auvesta – drahé kovy", g: "Auvesta", s: [100, 0, 0], vynos: 0.05, vstup: 0, sprava: 0, auv: 1 },
];
const AUV_TARIF = { S: 0, M: 600, L: 1200, XL: 2400 }; // poplatek (ážio) depozitu v EUR — Provizní příloha ZFP
const PROD_IDX = Object.fromEntries(PRODUKTY.map(p => [p.k, p]));

const DEFAULT_SET = { inflace: 0.03, hotovost_real: -0.03, renta_let: 20, doziti: 85, renta_r: 0.045, dip_strop: 4000, dps_nom: 0.02, dan: 0.15, smrt_nasobek: 3,
  prac_inv1: 0.5, prac_inv2: 0.3, dluh_mix: 0.5, auv_tarif: "M", eur_kurz: 24.5 };
const CASH = ["Běžný účet", "Spořicí účet", "Termínovaný vklad"];
const MOVE = ["Podílový fond (OPF)", "ETF", "Akcie / dluhopisy (přímé)", "Stavební spoření"];
const DETI_POJ = { tnu: 1000000, progrese: 10, zo: 500000, dou: 400 };

/* ---------------- motivace: z citátu (a cílů) automaticky 3 hodnoty s ikonou ---------------- */
const TEMATA = [
  ["rodina", /rodin|deti|dit[eéi]|syn[a ]|dcer|manzel|partner|blizk|vnou/, "Rodina na prvním místě", "Zajištění pro ty, na kterých nejvíc záleží"],
  ["jistota", /jistot|bezpec|klid|strach|rezerv|necekan|zajist|stabil/, "Jistota a klid", "Rezerva a ochrana pro nečekané situace"],
  ["svoboda", /svobod|nezavisl|volnost|nemuset|nemusel|rozhodovat|vlastni cas|cas pro/, "Svoboda", "Možnost rozhodovat se bez finančního tlaku"],
  ["bydleni", /bydlen|\bbyt|\bdum|\bdomu|domov|hypot|nemovit|stavb|chalup|chat[auy]/, "Vlastní bydlení", "Domov, který je opravdu náš"],
  ["auto", /\baut[oau]|akontac|\bvuz|vozidl|tesl/, "Nové auto", "Pořídit auto bez zbytečného úvěru"],
  ["cestovani", /cestov|\bsvet|dovolen|vylet|zazit|poznav/, "Zážitky a cestování", "Peníze na to, co si budeme pamatovat"],
  ["duchod", /duchod|\brent|stari|penz|odpocin|nepracovat|pasivni prijem/, "Finanční nezávislost", "Pasivní příjem místo závislosti na státu"],
  ["vzdelani", /vzdel|studi|skol|univerz/, "Vzdělání", "Investice do znalostí a budoucnosti"],
  ["podnikani", /podnik|firm|byzn|karier|projekt/, "Podnikání a růst", "Kapitál na rozvoj vlastních projektů"],
  ["zdravi", /zdrav|nemoc|uraz|kondic/, "Zdraví", "Finanční klid i při nemoci a úrazu"],
  ["rust", /bohat|majet|zhodnot|\brust|investic|milion|penize pracuj/, "Růst majetku", "Peníze, které pracují za mě"],
];
const fold = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function motivace(text, cile, renta) {
  const q = fold(text), g = fold((cile || []).map(c => c.nazev).join(" "));
  const sc = TEMATA.map(([k, re, t, d], i) => { const rg = new RegExp(re.source, "g"); const s = (q.match(rg) || []).length * 3 + (g.match(rg) || []).length + (k === "duchod" && renta ? 1 : 0); return { k, i, s, t, d }; });
  const top = sc.filter(x => x.s > 0).sort((a, b) => b.s - a.s || a.i - b.i).slice(0, 3);
  ["jistota", "svoboda", "duchod"].forEach(k => { if (top.length < 3 && !top.some(x => x.k === k)) top.push(sc.find(x => x.k === k)); });
  return top.map(x => ({ ic: x.k, t: x.t, d: x.d }));
}
const bezPartnera = inp => !!(inp.klient && inp.klient.bez_partnera) && !(inp.partner && inp.partner.zapnuto);

function compute(inp, today) {
  today = today || new Date();
  const T0 = new Date(today.getFullYear(), today.getMonth(), 1);
  const S = Object.assign({}, DEFAULT_SET, inp.nastaveni || {});
  Object.keys(DEFAULT_SET).forEach(k => { if (S[k] === "" || S[k] == null) S[k] = DEFAULT_SET[k]; else if (typeof DEFAULT_SET[k] === "number") S[k] = +S[k]; });

  const poplatky = pozice.map(p => { const pr = prod(p.k), f1 = feeOfProd(pr, p.jednor); return { nazev: p.nazev, k: p.k, vstupJ: Math.round(p.jednor * f1), vstupM: Math.round(p.mesicne * (pr.auv ? 0 : f1)), fee: f1, sprava: pr.sprava, vynos: pr.vynos, auv: !!pr.auv }; });
  // struktura po realokaci = skutečné zůstatky po transakcích
  const keptCash = produkty.filter(p => !p.novy && (CASH.includes(p.nazev) || srcs.some(s => s.cash && s.nazev === p.nazev) || p.nazev === "Spořicí účet")).reduce((s, p) => s + Math.max(0, p.zust), 0);
  const nove = [inv[0], inv[1] + dpsVal, inv[2] + keptCash];
  other.forEach(o => { const t = o.trida || "hotovost"; nove[t === "akcie" ? 0 : t === "dluhopisy" ? 1 : 2] += o.hodnota; });
  const struktura = { ted, tedPct: pct100(ted), nove, novePct: pct100(nove), cilPct: renta ? renta.alok : (cile[0] ? cile[cile.length - 1].alok : [0, 0, 100]) };
  const invest = pozice.filter(p => p.jednor > 0).map(p => ({ nazev: p.nazev, castka: p.jednor, k: p.k }));
  const invW = pct100(invest.map(p => p.castka));
  // ---------- katastrofy (po jednotlivci)
  const maPartnera = persons.length > 1 || !bezPartnera(inp);
  const zavisli = maPartnera || detiZav.length > 0;
  const incTot = Math.max(1, persons.reduce((s, q) => s + q.zam + q.podnik + q.pasiv + q.pronajem, 0));
  const katastrofy = persons.map(p => {
    const earned = p.zam + p.podnik, pas = p.pasiv + p.pronajem, normal = earned + pas;
    const vyd = p.vydaje || (persons.length > 1 ? Math.round(vydCelkem * normal / incTot / 100) * 100 : vydCelkem);
    const podil = persons.length > 1 ? normal / incTot : 1;
    const invPlan = Math.round(pmtCelkem * podil);
    if (!p.inv3) flags.push(`${p.jmeno}: chybí invalidní důchod III. st. z IOLDP — počítám 0 Kč.`);
    if (!p.inv1 || !p.inv2) flags.push(`${p.jmeno}: doplň invalidní důchod I. a II. st. z IOLDP.`);
    let pn, pnFaze = null;
    if (p.zam > 0) { const g = p.hruba || grossFromNet(p.zam); pnFaze = nemocenska(g); pn = pnFaze.d61; if (!p.hruba) flags.push(`${p.jmeno}: hrubá mzda odhadnuta z čisté (${Math.round(g)} Kč) — nemocenská je odhad.`); }
    else pn = 0;
    const scen = {
      normal: { prace: earned, pasivni: pas, inv: 0, nemocenska: 0 },
      inv: { prace: 0, pasivni: pas, inv: p.inv3, nemocenska: 0 },
      smrt: { prace: 0, pasivni: 0, inv: 0, nemocenska: 0 },
      pn: { prace: 0, pasivni: pas, inv: 0, nemocenska: pn },
    };
    Object.values(scen).forEach(s => { s.celkem = s.prace + s.pasivni + s.inv + s.nemocenska; s.rozdil = s.celkem - vyd; });
    // invalidita: renta do starobního důchodu, nebo do začátku čerpání renty z plánu (co nastane dřív)
    const doRenty = !!(renta && renta.start < p.duch);
    const konec = doRenty ? renta.start : p.duch;
    const roky = Math.max(0, yearsBetween(today, konec));
    const invSt = st => { const prac = st === 1 ? S.prac_inv1 : st === 2 ? S.prac_inv2 : 0, duch = st === 1 ? p.inv1 : st === 2 ? p.inv2 : p.inv3;
      const prijem = duch + pas + earned * prac, dop = Math.max(0, normal - prijem), min = Math.min(dop, Math.max(0, vyd - prijem));
      return { st, prac, duch, prijem, min, dop, pcMin: ceil(pvAnn(min, roky, S.renta_r), 100000), pcDop: ceil(pvAnn(dop, roky, S.renta_r), 100000) }; };
    const invAll = [invSt(1), invSt(2), invSt(3)];
    // pracovní neschopnost: výdaje včetně investic z plánu; pojistit, jen když rezerva nepokryje 12 měsíců deficitu
    const vydPN = vyd + invPlan;
    const davka = m => p.zam > 0 ? (m === 0 ? pnFaze.d15 : m === 1 ? pnFaze.d31 : pnFaze.d61) : 0;
    let need12 = 0; for (let m = 0; m < 12; m++) need12 += Math.max(0, vydPN - davka(m) - pas);
    const uspory = rezVklad, pnTreba = uspory < need12 - 1;
    const pnDef = Math.max(0, vydPN - pn - pas), pnDop = Math.max(pnDef, normal - scen.pn.celkem);
    /* úmrtí: s dětmi = výpadek příjmu rodiny (příjem − vdovský − sirotčí) do 26 let nejmladšího dítěte;
       jen partner = násobek ročního příjmu minus vdovský důchod (vyplácí se 1 rok); bez závislých jen úvěry */
    const pozustali = { vdovsky: maPartnera ? p.vdovsky : 0, sirotci: p.sirotci * detiZav.length, deti: detiZav.length };
    let smrt3 = 0, smrtMet = zavazky > 0 ? "uvery" : "nic", smrtGap = 0, smrtRoky = 0;
    if (detiZav.length) { smrtRoky = Math.max(0, 26 - Math.min(...detiZav.map(d => d.vek))); smrtGap = Math.max(0, earned - pozustali.vdovsky - pozustali.sirotci); smrt3 = ceil(pvAnn(smrtGap, smrtRoky, S.renta_r), 100000); smrtMet = "deti"; }
    else if (maPartnera) { smrt3 = ceil(Math.max(0, S.smrt_nasobek * 12 * earned - 12 * pozustali.vdovsky), 100000); smrtGap = earned; smrtRoky = S.smrt_nasobek; smrtMet = "partner"; }
    return { osoba: p, vyd, vydPN, invPlan, normal, scen, pnFaze, roky, konec, doRenty,
      inv: invAll[2], invAll,
      pn: { min: pnTreba ? pnDef : 0, dop: pnTreba ? pnDop : 0, def: pnDef, denniMin: pnTreba ? ceil(pnDef / 30, 10) : 0, denniDop: pnTreba ? ceil(pnDop / 30, 10) : 0, need12, uspory, treba: pnTreba },
      smrt: { prijem3: smrt3, zavazky, pc: smrt3 + zavazky, zavisli, treba: smrt3 + zavazky > 0, pozustali, metoda: smrtMet, gap: smrtGap, roky: smrtRoky },
      stav: p.zp };
  });
  if (!zavisli) flags.push(zavazky > 0 ? "Úmrtí: bez partnera a dětí — krytí jen na splacení úvěrů." : "Úmrtí: bez partnera, dětí a závazků — pojištění pro případ smrti není potřeba.");
  katastrofy.forEach(k => { if (!k.pn.treba) flags.push(`${k.osoba.jmeno}: rezerva ${kc(k.pn.uspory)} pokryje 12 měsíců nemoci (potřeba ${kc(k.pn.need12)}) — PN není nutné pojistit.`); });
  const detiPoj = deti.map(d => Object.assign({ jmeno: d.jmeno, vek: d.vek }, DETI_POJ));
  // ---------- časová osa
  const hodnota = m => rezVklad + cile.reduce((s, c) => s + (m < c.months ? fvOf(c.vklad, c.pmt, c.r, m, c.fee) : 0), 0) + (renta ? fvOf(renta.vklad, renta.pmt, renta.r, Math.min(m, renta.months), renta.fee) : 0);
  const udalosti = [{ typ: "start", datum: T0, titul: "Start plánu", m: 0 }];
  uvery.forEach(u => {
    if (u.fixace && u.fixace > today && (!u.splatnost || u.fixace < u.splatnost)) udalosti.push({ typ: "refix", datum: u.fixace, titul: "Refixace: " + u.nazev, m: monthsBetween(T0, u.fixace), uver: u });
    if (u.splatnost && u.splatnost > today) udalosti.push({ typ: "splaceno", datum: u.splatnost, titul: "Splaceno: " + u.nazev, m: monthsBetween(T0, u.splatnost), uver: u });
  });
  cile.forEach(c => udalosti.push({ typ: "cil", datum: c.datum, titul: c.nazev, cil: c, m: c.months }));
  if (renta) udalosti.push({ typ: "renta", datum: renta.start, titul: "Renta", m: renta.months });
  udalosti.sort((a, b) => a.m - b.m);
  const fee0 = (needA * CA.fee + needD * CD.fee) / Math.max(1, needA + needD + cashPlan);
  udalosti.forEach(u => u.hodnota = u.typ === "start" ? rezVklad + (majCelkem - rezVklad - dpsVal) * (1 - fee0) + dpsVal : hodnota(u.m));
  return { S, flags, persons, deti, detiPoj, prijmy, vydCelkem, cf, docasne, rez: { cil: rezCil, vklad: rezVklad, chybi: rezChybi, pravidlo: rezPravidlo },
    maj, majCelkem, nefin, nefinCelkem, uvery, zavazky, jmeni: majCelkem + nefinCelkem - zavazky,
    cile, renta, pojNove, pmtCelkem, cfZbyva, alokovano: majCelkem - Math.max(0, volne), zbyva: Math.max(0, volne), produkty, pozice, transakce, kontrola, manual,
    poplatky, struktura, trida: { A: CA, D: CD, rA, rD, rH }, need: { A: needA, D: needD, H: cashPlan, mes: pmtCelkem, zdroje },
    portfolio: { invest, w: invW, bondNom: CD.rNom, akcNom: CA.rNom }, katastrofy, udalosti, dip, motivace: motivace(inp.motivace, inp.cile, rentaMes > 0), maPartnera, MES, MES2 };
}
return { compute, alok, motivace, nemocenska, grossFromNet, pvAnn, pct100, DEFAULT_SET, PRODUKTY, AUV_TARIF, DETI_POJ, CASH, MOVE, MES, MES2 };
});

function set(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k]});a[ks.at(-1)]=v}
function fld(lbl,p,type="number",extra=""){const v=get(inp(),p);if(type==="number")return `<label class="f">${lbl}<input data-p="${p}" data-num="1" type="text" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(v))}" ${extra}></label>`;return `<label class="f">${lbl}<input data-p="${p}" type="${type}" value="${esc(v==null?"":v)}" ${extra}></label>`}
/* procenta: zadávají se celá čísla (4 = 4 %), ukládají se desetinně */
const p100=v=>v===""||v==null?"":Math.round(+v*10000)/100;
function pfld(lbl,p,def,extra=""){const v=get(inp(),p);return `<label class="f">${lbl}<input data-p="${p}" data-pct="1" type="number" step="0.01" inputmode="decimal" value="${esc(p100(v))}" placeholder="${esc(p100(def))}" ${extra}></label>`}

function rows(path,cols,blank){const L=get(inp(),path)||[];return `<div class="rows">${L.map((r,i)=>`<div class="row" style="grid-template-columns:1fr 1fr">${cols.map(([lbl,k,type,w,opts])=>opts?`<label class="f"${w==="full"?' style="grid-column:1/-1"':""}>${lbl}<select data-p="${path}.${i}.${k}">${opts.map(o=>{const[val,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${val==r[k]?"selected":""}>${esc(t)}</option>`}).join("")}</select></label>`:type==="number"?`<label class="f">${lbl}<input data-p="${path}.${i}.${k}" data-num="1" type="text" inputmode="decimal" autocomplete="off" value="${esc(fmtIn(r[k]))}"></label>`:`<label class="f">${lbl}<input data-p="${path}.${i}.${k}" type="${type}" value="${esc(r[k]==null?"":r[k])}"></label>`).join("")}<button class="x" data-del="${path}.${i}" title="Odebrat" style="grid-column:1/-1;justify-self:end;font-size:12px">✕ odebrat</button></div>`).join("")}<button class="add" data-add="${path}" data-blank='${esc(JSON.stringify(blank))}'>+ přidat</button></div>`}

function missing(I,R){const M=[],add=(st,p,t)=>M.push({st,p,t});const ppl=[["klient",I.klient||{}]].concat(I.partner&&I.partner.zapnuto?[["partner",I.partner]]:[]);

    if(!p.jmeno)add(0,k+".jmeno","Jméno");if(!p.narozen)add(0,k+".narozen",n+": datum narození");
    if(!(+p.zam||+p.podnik||+p.pasiv))add(0,k+".zam",n+": příjem");
    ["inv1","inv2","inv3"].forEach((x,i)=>{if(!+p[x])add(0,k+"."+x,n+`: invalidní důchod ${["I.","II.","III."][i]} st. (IOLDP)`)});
    if(R&&R.renta&&!+p.starobni)add(0,k+".starobni",n+": odhad starobního důchodu (IOLDP)");
    if(+p.zam&&!+p.hruba)add(0,k+".hruba",n+": hrubá mzda (nemocenská)");

  if(!(I.cile||[]).length&&!+((I.renta||{}).mesicne))add(2,"renta.mesicne","Alespoň jeden cíl nebo renta");
  if(!+((I.pojisteni||{}).navrh))add(3,"pojisteni.navrh","Navržené pojistné");
  if(R&&R.manual)R.kontrola.filter(x=>!x.ok).forEach(x=>add(4,"realokace",x.t));
  return M}

const NBS=" ";
function fmtIn(v){if(v===""||v==null||isNaN(+v))return v==null?"":String(v);const[a,b]=String(v).split(".");const s=a.replace(/\B(?=(\d{3})+(?!\d))/g,NBS);return b!=null?s+","+b:s}
function parseIn(t){const c=String(t).replace(/[\s ]/g,"").replace(",",".");if(c===""||c==="-")return "";const n=+c;return isFinite(n)?n:""}
$("#ed").addEventListener("input",e=>{
  const t=e.target,p=t.dataset.p;if(!p)return;
  let v=t.type==="checkbox"?t.checked:t.type==="number"?(t.value===""?"":+String(t.value).replace(",",".")):t.value;
  if(t.dataset.num){v=parseIn(t.value);const pos=t.selectionStart||0,dig=t.value.slice(0,pos).replace(/[^\d,.-]/g,"").length,keepDec=/[,.]$/.test(t.value)?",":"";
    const f=v===""?"":fmtIn(v)+keepDec;if(f!==t.value){t.value=f;let k=0,c=0;while(c<f.length&&k<dig){if(/[\d,.-]/.test(f[c]))k++;c++}try{t.setSelectionRange(c,c)}catch(err){}}}
  if(t.dataset.pct&&v!=="")v=Math.round(v*100)/10000;
  set(inp(),p,v);save();
  if(["partner.zapnuto","realokace.rucne","hodnoty_vlastni"].includes(p)){if(p==="realokace.rucne"&&v&&!((inp().realokace||{}).polozky||[]).length)loadAuto();keepOpen(renderEditor)}
  if(p.endsWith(".jmeno")&&p.startsWith("klient"))renderClients();
  update();
});

$("#ed").addEventListener("click",e=>{

  const gb=e.target.closest("[data-go]");if(gb){const[a,b]=gb.dataset.go.split("|");goStep(+a,b);return}

  if(a){const p=a.dataset.add;const L=get(inp(),p)||[];L.push(JSON.parse(a.dataset.blank));set(inp(),p,L);save();keepOpen(renderEditor);update()}
  if(d){const ps=d.dataset.del.split(".");const i=+ps.pop();const L=get(inp(),ps.join("."));L.splice(i,1);save();keepOpen(renderEditor);update()}
});

let FR=[],cur=0,R=null;
function compute(){try{R=FPE.compute(inp(),new Date());FR=buildFrames(inp(),R)}catch(e){console.error(e);FR=[{g:"err",h:`<div style="padding:60px;font-size:28px;color:#DF6A6A">Chyba ve vstupech: ${esc(e.message)}</div>`,lbl:"Chyba"}]}}
function scaleStage(boxEl,stageEl){const w=boxEl.clientWidth;stageEl.style.transform=`scale(${w/1600})`}
function show(stageEl,i,animate){
  const f=FR[i];if(!f)return;
  const old=stageEl.querySelector(".sl:not(.leave)");
  if(old&&old.dataset.g===f.g&&animate!==false){ // stejná skupina → plynulý přechod (Morph)
    const tmp=document.createElement("div");tmp.innerHTML=f.h;
    const mapNew={};tmp.querySelectorAll("[data-k]").forEach(e=>mapNew[e.dataset.k]=e);
    old.querySelectorAll("[data-k]").forEach(e=>{const n=mapNew[e.dataset.k];if(!n)return;e.setAttribute("style",n.getAttribute("style")||"");if(e.innerHTML!==n.innerHTML)e.innerHTML=n.innerHTML});
    // nekeyované prvky (titulek ap.) přepsat
    const keepK=new Set(Object.keys(mapNew));
    [...old.children].forEach((c,ix)=>{if(!c.dataset.k&&tmp.children[ix]&&!tmp.children[ix].dataset.k&&c.outerHTML!==tmp.children[ix].outerHTML)c.outerHTML=tmp.children[ix].outerHTML});
    return}
  const el=document.createElement("div");el.className="sl";el.dataset.g=f.g;el.innerHTML=f.h;
  if(old&&animate!==false){el.classList.add("enter");stageEl.appendChild(el);requestAnimationFrame(()=>requestAnimationFrame(()=>{el.classList.remove("enter");old.classList.add("leave");setTimeout(()=>old.remove(),700)}))}
  else{stageEl.innerHTML="";stageEl.appendChild(el)}
}
function update(){
  compute();if(cur>=FR.length)cur=FR.length-1;
  const st=$("#stage");st.innerHTML="";show(st,cur,false);scaleStage($("#box"),st);
  $("#cnt").textContent=`${cur+1} / ${FR.length} · ${FR[cur].lbl}`;
  $("#thumbs").innerHTML=FR.map((f,i)=>`<button data-i="${i}" class="${i===cur?"on":""}" title="${esc(f.lbl)}"><div class="mini"><div class="sl">${f.h}</div></div><span class="tl">${i+1}. ${esc(f.lbl)}</span></button>`).join("");
  renderCheck();
  const ko=$("#kontrola");if(ko&&R&&R.kontrola)ko.innerHTML=(R.manual?"":`<li style="color:var(--mut)">Automatický návrh – zaškrtni „Upravit ručně“ pro vlastní rozdělení.</li>`)+R.kontrola.map(x=>`<li style="color:${x.ok?"#3E9B7A":"#DF6A6A"};font-weight:${x.ok?400:700}">${esc(x.t)}</li>`).join("");
  const mp=$("#motPrev");if(mp&&R)mp.textContent=R.motivace.map(m=>m.t).join(" · ");
  if($("#pres").classList.contains("on")){const ps=$("#pstage");ps.innerHTML="";show(ps,cur,false)}
}
function go(d){const n=Math.max(0,Math.min(FR.length-1,cur+d));if(n===cur)return;cur=n;
  show($("#stage"),cur);$("#cnt").textContent=`${cur+1} / ${FR.length} · ${FR[cur].lbl}`;document.querySelectorAll("#thumbs button").forEach((b,i)=>b.classList.toggle("on",i===cur));
  const tb=document.querySelector("#thumbs button.on");tb&&tb.scrollIntoView({block:"nearest",inline:"nearest"});
  if($("#pres").classList.contains("on")){show($("#pstage"),cur);$("#pc").textContent=`${cur+1} / ${FR.length}`}}
$("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
$("#thumbs").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=+b.dataset.i;update()};
$("#box").onclick=()=>go(1);
addEventListener("resize",()=>{scaleStage($("#box"),$("#stage"));scaleStage($("#pbox"),$("#pstage"))});
addEventListener("keydown",e=>{const pres=$("#pres").classList.contains("on");const tag=(document.activeElement||{}).tagName;if(!pres&&/INPUT|SELECT|TEXTAREA/.test(tag))return;
  if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();go(1)}else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();go(-1)}else if(e.key==="Escape"&&pres)stopPres();else if(e.key==="Home"){cur=0;update()}});
function startPres(){$("#pres").classList.add("on");const ps=$("#pstage");ps.innerHTML="";show(ps,cur,false);scaleStage($("#pbox"),ps);$("#pc").textContent=`${cur+1} / ${FR.length}`;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}setTimeout(()=>scaleStage($("#pbox"),ps),200)}
function stopPres(){$("#pres").classList.remove("on");try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}update()}
$("#bPres").onclick=startPres;$("#px").onclick=e=>{e.stopPropagation();stopPres()};
$("#pres").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();go(e.clientX<r.width*0.25?-1:1)};
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&$("#pres").classList.contains("on"))stopPres()});
let tx0=null;$("#pres").addEventListener("touchstart",e=>tx0=e.touches[0].clientX,{passive:true});$("#pres").addEventListener("touchend",e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;if(Math.abs(dx)>40){e.preventDefault();go(dx<0?1:-1)}tx0=null});
/* PDF: každý snímek jako stránka */
$("#bPdf").onclick=()=>{const p=$("#print");p.innerHTML=FR.map(f=>`<div class="pp"><div class="stage"><div class="sl">${f.h}</div></div></div>`).join("");setTimeout(()=>window.print(),300)};
/* klienti */
function renderClients(){$("#cli").innerHTML=Object.entries(DB.clients).map(([id,c])=>`<option value="${id}" ${id===DB.cur?"selected":""}>${esc((c.klient&&c.klient.jmeno)||"Bez jména")}</option>`).join("")}
$("#cli").onchange=e=>{DB.cur=e.target.value;save();cur=0;renderEditor();update()};
const blank=()=>({klient:{titul:"",jmeno:"Nový klient",narozen:"",duchod:"",zam:0,podnik:0,pasiv:0,pronajem:0,bonus:0,vydaje_osobni:0,inv1:0,inv2:0,inv3:0,vdovsky:0,sirotci:0,hruba:"",bez_partnera:false},partner:{zapnuto:false},deti:[],motivace:"",vydaje:{celkem:0,splatky:0,pojistne:0,sporeni:0},docasne:[],majetek:[],nefin:[],uvery:[],cile:[],renta:{mesicne:0,od_veku:""},pojisteni:{stavajici:0,navrh:0},realokace:{rucne:false,polozky:[]}});
$("#bNew").onclick=()=>{const id="c"+Date.now();DB.clients[id]=blank();DB.cur=id;save();cur=0;renderClients();renderEditor();update()};
$("#bDup").onclick=()=>{const id="c"+Date.now();DB.clients[id]=JSON.parse(JSON.stringify(inp()));DB.clients[id].klient.jmeno+=" (kopie)";DB.cur=id;save();renderClients();renderEditor();update()};
$("#bDel").onclick=()=>{if(Object.keys(DB.clients).length<2)return;if(!confirm("Smazat klienta "+(inp().klient.jmeno||"")+"?"))return;delete DB.clients[DB.cur];DB.cur=Object.keys(DB.clients)[0];save();renderClients();renderEditor();update()};
$("#bExp").onclick=()=>{const b=new Blob([JSON.stringify(inp(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="FP_"+((inp().klient.jmeno||"klient").split(" ").pop())+".json";a.click()};
$("#bImp").onclick=()=>$("#fImp").click();
$("#fImp").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.klient)throw new Error("není to soubor plánu");const id="c"+Date.now();DB.clients[id]=d;DB.cur=id;save();renderClients();renderEditor();update()}catch(err){alert("Import se nepovedl: "+err.message)}e.target.value=""};
function boot(){renderClients();renderEditor();update()}
if(HOST){
  ["#cli","#bNew","#bDup","#bDel"].forEach(q=>$(q).style.display="none");
  const cb=document.createElement("button");cb.className="btn";cb.textContent="✕ Zavřít";cb.onclick=()=>{clearTimeout(saveT);parent.postMessage({type:"fp:save",plan:inp(),close:true},location.origin)};$(".top").prepend(cb);
  addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=="fp:init")return;
    const d=e.data,pl=d.plan&&d.plan.klient?d.plan:blank(),pf=d.prefill||{};if(!(d.plan&&d.plan.klient))pl.klient.jmeno="";
    /* údaje z Pipeline (jméno, narození, IOLDP) doplní prázdná pole; IOLDP z kalkulačky má přednost, když je novější */
    Object.entries(pf).forEach(([k,v])=>{if(v==null||v==="")return;if(pl.klient[k]==null||pl.klient[k]===""||pl.klient[k]===0||(d.ioldpNew&&/^(inv[123]|vdovsky|sirotci|duchod|starobni)$/.test(k)))pl.klient[k]=v});
    if(d.kurz){pl.nastaveni=pl.nastaveni||{};if(pl.nastaveni.eur_kurz==null||pl.nastaveni.eur_kurz==="")pl.nastaveni.eur_kurz=d.kurz}
    DB={cur:"h",clients:{h:pl}};boot()});
  parent.postMessage({type:"fp:ready"},location.origin);
}else boot();
new ResizeObserver(()=>scaleStage($("#box"),$("#stage"))).observe($("#box"));
</script>
</body>
</html>
