<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanční plán – živá prezentace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f5;--panel:#ffffff;--line:#e2e2e6;--txt:#1c1c1f;--mut:#6b6b74;--acc:#F37520;--inp:#fff;--chip:#f0f0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f10;--panel:#18181a;--line:#2b2b2f;--txt:#ececee;--mut:#9a9aa3;--inp:#121214;--chip:#222226}}
:root[data-theme="dark"]{--bg:#0f0f10;--panel:#18181a;--line:#2b2b2f;--txt:#ececee;--mut:#9a9aa3;--inp:#121214;--chip:#222226}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 Lato,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.top h1{font-size:16px;margin:0 8px 0 0;font-weight:900;white-space:nowrap}
.top h1 b{color:var(--acc)}
.top select{max-width:220px}
.btn{border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.sp{flex:1}
.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:0;height:calc(100vh - 57px)}
.ed{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 12px 40px}
.view{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
details{border-bottom:1px solid var(--line);padding:6px 0}
summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"▾";color:var(--mut)}
details:not([open]) summary::after{content:"▸"}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:6px 0}
.g.one{grid-template-columns:1fr}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mut);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:6px 8px;color:var(--txt);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.rows{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.row{display:grid;gap:6px;align-items:end;background:var(--chip);border-radius:8px;padding:6px}
.row .x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:4px}
.add{font-size:12px;color:var(--acc);background:none;border:1px dashed var(--line);border-radius:7px;padding:6px;cursor:pointer;width:100%}
.hint{font-size:12px;color:var(--mut);margin:4px 0}
.flags{font-size:12px;margin:0;padding-left:16px;color:var(--mut)}
.flags li{margin:3px 0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.steps{display:flex;flex-wrap:wrap;gap:4px;position:sticky;top:-8px;background:var(--panel);z-index:5;padding:8px 0 8px;margin:0 0 4px;border-bottom:1px solid var(--line)}
.steps button{flex:none;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.steps button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.steps .sn{display:inline-flex;width:18px;height:18px;border-radius:50%;background:rgba(127,127,127,.2);align-items:center;justify-content:center;font-size:11px}
.steps .bd{background:#DF6A6A;color:#fff;border-radius:999px;font-size:10.5px;padding:0 6px;line-height:16px}
.chkbox details{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin:8px 0;background:var(--chip)}
.mailov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.mailbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:8px;padding:14px 16px}
.mailbox .mh{display:flex;align-items:center;gap:8px;font-size:15px}
.mailbox input[type=email],.mailbox input[type=text]{background:var(--inp);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--txt);width:100%}
.mailbox textarea{flex:1;min-height:340px;background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--txt);font:13.5px/1.5 Lato,system-ui,sans-serif;resize:vertical}
.mailbox .msecs{display:flex;flex-wrap:wrap;gap:2px 14px}
.mailbox .msecs .chk{margin:2px 0}
.mailbox .mf{display:flex;gap:8px;align-items:center}
.mailbox .matt{font-size:13px;color:var(--mut)}
.miss{list-style:none;margin:4px 0 6px;padding:0;display:flex;flex-direction:column;gap:3px}
.miss button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12.5px}
.miss button span{color:var(--acc);white-space:nowrap}
.miss button:hover{border-color:var(--acc)}
.stepnav{display:flex;justify-content:space-between;margin:14px 0}
label.f input.bad{border-color:#c0392b;outline:2px solid #c0392b;outline-offset:-1px}
.flash{outline:3px solid var(--acc)!important;outline-offset:1px;transition:outline-color .3s}
/* náhled */
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav .cnt{color:var(--mut);font-size:13px}
.stageBox{position:relative;width:100%;aspect-ratio:16/9;background:#111;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumbs button{flex:none;border:2px solid transparent;border-radius:6px;padding:0;background:#111;cursor:pointer;width:128px;height:72px;overflow:hidden;position:relative}
.thumbs button.on{border-color:var(--acc)}
.thumbs .th{flex:none;display:flex;flex-direction:column;gap:3px}
.thumbs .th.skip button{opacity:.3}
.thumbs .th.skip .tl{text-decoration:line-through}
.thumbs .th label.sk{font-size:11px;display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--mut);white-space:nowrap}
.thumbs .th.skip label.sk{color:#DF6A6A}
.skipCur{display:flex;gap:5px;align-items:center;cursor:pointer;font-size:13px}
.thumbs .tl{position:absolute;inset:auto 0 0 0;font-size:10px;background:rgba(0,0,0,.6);color:#ddd;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs .mini{position:absolute;left:0;top:0;width:1600px;height:900px;transform:scale(.08);transform-origin:0 0;pointer-events:none}
/* prezentační režim */
.present{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;cursor:pointer}
.present.on{display:flex}
.present .pbox{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden}
.present .pc{position:absolute;right:14px;bottom:10px;color:#666;font-size:12px;z-index:5;cursor:default}
.present .px{position:absolute;right:12px;top:10px;z-index:5;background:rgba(255,255,255,.08);color:#aaa;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}

/* ================= SLIDY (design 1600×900) ================= */
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.sl{position:absolute;inset:0;background:#161616;color:#efefef;font-family:Lato,system-ui,sans-serif;overflow:hidden;transition:opacity .55s ease, transform .7s cubic-bezier(.2,.8,.2,1)}
.sl.enter{opacity:0}
.sl.leave{opacity:0}
.sl .bar{position:absolute;left:0;top:0;width:100%;height:13px;background:#F37520}
.sl .logo{position:absolute;right:72px;top:62px;width:110px}
.sl h2{position:absolute;left:80px;top:40px;margin:0;font-size:46px;font-weight:900;letter-spacing:-.5px}
.sl .sub{position:absolute;left:80px;top:122px;font-size:20px;color:#b4b4b4}
.o{color:#F37520}.mut{color:#b4b4b4}.grn{color:#4FB389}.red{color:#DF6A6A}
.card{position:absolute;background:#202020;border:1px solid #2e2e2e;border-radius:10px}
.k{transition:all .9s cubic-bezier(.2,.8,.2,1)}
/* „přetáčení času“ při předání platby dalšímu cíli: přes celý slajd se rychle protočí „za N let“ (jako když se video přetáčí dopředu).
   Overlay je první prvek snímku, takže ~ zdrží morph tabulky, dokud overlay nezmizí. */
@property --ffy{syntax:'<integer>';inherits:false;initial-value:0}
.ffw{position:absolute;inset:0;z-index:50;pointer-events:none;overflow:hidden;background:rgba(10,10,10,.92);opacity:0;animation:ffwBg 1.9s ease-in-out both}
.ffw~.k{transition-delay:1.35s}
.ffw .ln{position:absolute;left:-45%;width:55%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(243,117,32,.9),transparent);animation:ffwLn .5s linear infinite}
.ffw .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 5px);animation:ffwScan .35s steps(5) infinite}
.ffw .band{position:absolute;left:0;right:0;height:90px;background:linear-gradient(180deg,transparent,rgba(243,117,32,.10),transparent);animation:ffwBand .8s linear infinite}
.ffw .big{position:absolute;left:0;right:0;top:300px;text-align:center;font-weight:900;font-size:240px;line-height:1;color:#F37520;letter-spacing:-5px;white-space:nowrap;animation:ffwTx 1.9s cubic-bezier(.2,.8,.2,1) both}
.ffw .big .n{display:inline-block;animation:ffwCnt 1.15s cubic-bezier(.12,.75,.2,1) .15s both;counter-reset:ffy var(--ffy)}
.ffw .big .n::before{content:counter(ffy)}
.ffw .big .w{font-size:130px;letter-spacing:-2px;color:#efefef;margin-left:26px}
.ffw .cap{position:absolute;left:120px;right:120px;top:600px;text-align:center;font-size:30px;color:#efefef;animation:ffwCap 1.9s ease-out both}
.ffw .tag{position:absolute;left:80px;top:60px;font-size:26px;font-weight:900;letter-spacing:3px;color:#F37520;animation:ffwBlink .5s steps(2) infinite}
.ffw .seek{position:absolute;left:120px;right:120px;top:765px;height:10px;border-radius:5px;background:#2c2c2c}
.ffw .seek i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px;background:#F37520;transform-origin:0 50%;animation:ffwSeek 1.3s cubic-bezier(.12,.75,.2,1) .15s both}
.ffw .seek b{position:absolute;top:-8px;width:6px;height:26px;border-radius:3px;background:#fff;animation:ffwHead 1.3s cubic-bezier(.12,.75,.2,1) .15s both}
.ffw .se{position:absolute;top:790px;font-size:18px;color:#b4b4b4}
.thumbs .ffw,.mini .ffw{display:none}
@keyframes ffwBg{0%{opacity:0}9%{opacity:1}78%{opacity:1}100%{opacity:0}}
@keyframes ffwLn{from{transform:translateX(0)}to{transform:translateX(340%)}}
@keyframes ffwScan{from{transform:translateY(0)}to{transform:translateY(5px)}}
@keyframes ffwBand{from{transform:translateY(-120px)}to{transform:translateY(980px)}}
@keyframes ffwTx{0%{transform:translateX(-14%) scaleX(1.3);filter:blur(16px);opacity:0}14%{transform:none;filter:none;opacity:1}80%{transform:none;filter:none;opacity:1}100%{transform:translateX(12%) scaleX(1.25);filter:blur(12px);opacity:0}}
@keyframes ffwCnt{from{--ffy:0}to{--ffy:var(--n)}}
@keyframes ffwCap{0%,28%{opacity:0;transform:translateY(14px)}46%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@keyframes ffwBlink{0%{opacity:1}50%{opacity:.35}}
@keyframes ffwSeek{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ffwPillOut{from{opacity:1}to{opacity:0;transform:scale(.7)}}
@keyframes ffwHead{from{left:0}to{left:calc(100% - 6px)}}
@media (prefers-reduced-motion:reduce){.ffw .ln,.ffw .scan,.ffw .band{animation:none}}
@property --p1{syntax:'<percentage>';inherits:false;initial-value:0%}
@property --p2{syntax:'<percentage>';inherits:false;initial-value:0%}
.dn{border-radius:50%;background:conic-gradient(#F37520 0 var(--p1),#5b8dd6 0 var(--p2),#8a8a8a 0);-webkit-mask:radial-gradient(circle,transparent 57%,#000 57.5%);mask:radial-gradient(circle,transparent 57%,#000 57.5%);transition:--p1 1.3s cubic-bezier(.2,.8,.2,1),--p2 1.3s cubic-bezier(.2,.8,.2,1)}
table.t{position:absolute;border-collapse:collapse;font-size:17px}
table.t th{background:#2a2a2a;color:#cfcfcf;font-weight:700;text-align:right;padding:10px 12px;font-size:14px;text-transform:uppercase;letter-spacing:.3px}
table.t th:first-child,table.t td:first-child{text-align:left;padding-left:20px}
table.t th:last-child,table.t td:last-child{padding-right:20px}
table.t td{padding:10px 12px;border-bottom:1px solid #2c2c2c;text-align:right;white-space:nowrap}
table.t tr.sum td{font-weight:900;border-top:1px solid #444}
table.tcf th{padding:6px 12px}table.tcf td{padding:5px 12px}
.pill{display:inline-block;padding:5px 14px;border-radius:4px;color:#fff;font-weight:900;font-size:14px;letter-spacing:.4px}
.node{position:absolute;border-radius:50%;transition:all .9s cubic-bezier(.2,.8,.2,1)}
.nl{position:absolute;text-align:center;transition:all .9s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.foot{position:absolute;left:80px;right:80px;bottom:22px;font-size:12.5px;color:#8a8a8a;line-height:1.35}
.shot{position:absolute;border:2px dashed #555;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#888;font-size:16px;overflow:hidden;background:#1d1d1d}
.shot img{width:100%;height:100%;object-fit:contain}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.ed{max-height:none;border-right:0;border-bottom:1px solid var(--line)}.view{padding:16px}}
@media print{
  body{background:#fff}.top,.wrap{display:none!important}
  .print{display:block!important}
  .pp{width:297mm;height:167.06mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
  .pp .stage{transform:scale(.70157)}
  @page{size:297mm 167.06mm;margin:0}
}
.print{display:none}
</style>
</head>
<body>
<div class="top">
  <h1>Finanční plán <b>živě</b></h1>
  <select id="cli" aria-label="Klient"></select>
  <button class="btn" id="bNew">+ Nový klient</button>
  <button class="btn" id="bDup">Duplikovat</button>
  <button class="btn" id="bDel">Smazat</button>
  <span class="sp"></span>
  <button class="btn" id="bDz" title="Vstupní dotazník – vyplnit s klientem, nebo poslat klientovi odkaz">📝 Dotazník</button>
  <button class="btn" id="bImp" title="Plán (.json) nebo vyplněný dotazník od klienta">Import</button>
  <button class="btn" id="bExp">Export</button>
  <button class="btn" id="bPdf">PDF</button>
  <button class="btn" id="bPptx" title="Export do PowerPointu s přechody Morph">PowerPoint</button>
  <button class="btn" id="bMail" title="Shrnutí plánu pro klienta – text podle toho, co je v prezentaci (vynechané slidy se nepíšou)">✉️ Shrnutí mailem</button>
  <button class="btn pri" id="bPres">▶ Prezentovat</button>
  <input type="file" id="fImp" accept=".json,application/json" hidden>
</div>
<div class="wrap">
  <aside class="ed" id="ed"></aside>
  <main class="view">
    <div class="nav">
      <button class="btn" id="prev">◀</button><button class="btn" id="next">▶</button>
      <span class="cnt" id="cnt"></span><label class="skipCur" title="Slide se nezobrazí v prezentaci, PDF ani PowerPointu"><input type="checkbox" id="skipCur"> Vynechat slide</label><button class="btn" id="bScr" title="Co říct ke každému slidu – vidíš jen ty, v režimu Prezentovat se nezobrazuje">🎙 Skript</button><span class="sp"></span>
      <span class="cnt">Změna vstupu vlevo = okamžitý přepočet. Prezentace: ←/→, mezerník, klik; Esc konec.</span>
    </div>
    <div class="stageBox" id="box"><div class="stage" id="stage"></div></div>
    <div class="scr" id="scr" hidden><div class="scrbar"><span>Skript ke slidu – vidíš jen ty</span><span class="sp"></span><button class="btn" id="scrWin" title="Skript v samostatném okně – na druhý monitor nebo vedle prezentace; listuje se spolu s prezentací">⧉ Otevřít v okně</button></div><div id="scrBody"></div></div>
    <div class="thumbs" id="thumbs"></div>
  </main>
</div>
<div class="present" id="pres"><div class="pbox" id="pbox"><div class="stage" id="pstage"></div></div><button class="px" id="px">✕ Esc</button><div class="pc" id="pc"></div></div>
<div class="print" id="print"></div>

<script src="nnrs.js?v=1"></script>
<script>/* FP engine — výpočet finančního plánu (metodika ZFP / VK). Čistá funkce compute(inp, today). */
(function (root, f) { const E = f(); if (typeof module === "object" && module.exports) module.exports = E; else root.FPE = E; })(this, function () {
"use strict";
const ALOK = { 0: [0, 0, 100], 5: [29, 62, 9], 10: [54, 43, 3], 15: [74, 24, 2], 20: [85, 13, 2], 25: [90, 8, 2], 30: [93, 7, 0] };
const MES = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const MES2 = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const n0 = v => (v !== "" && v != null && isFinite(+v) ? +v : 0);
const ceil = (v, s) => Math.ceil(v / s - 1e-9) * s;
const floorTo = (v, s) => Math.floor(v / s + 1e-9) * s;
function alok(y) {
  y = Math.max(0, Math.min(30, y)); const k = Object.keys(ALOK).map(Number);
  for (let i = 0; i < k.length - 1; i++) { const a = k[i], b = k[i + 1]; if (y >= a && y <= b) { const t = (y - a) / (b - a), A = Math.round(ALOK[a][0] + t * (ALOK[b][0] - ALOK[a][0])), D = Math.round(ALOK[a][1] + t * (ALOK[b][1] - ALOK[a][1])); return [A, D, 100 - A - D]; } }
  return ALOK[30];
}
/* volba „bez hotovosti mimo rezervu“: hotovostní složka cíle/renty přejde do dluhopisů */
const bezHot = (a, S) => S && S.bez_hotovosti && a[2] > 0 ? [a[0], a[1] + a[2], 0] : a;
const mr = r => Math.pow(1 + r, 1 / 12) - 1;
function parseDate(s) { if (!s) return null; if (s instanceof Date) return s; const m = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/.exec(String(s)); if (!m) return null; return new Date(+m[1], +m[2] - 1, +(m[3] || 1)); }
const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
const yearsBetween = (a, b) => (b - a) / (365.25 * 864e5);
const dpsStatni = v => { v = +v || 0; return v >= 500 ? Math.round(Math.min(v, 1700) * 0.2) : 0; };
function pvAnn(m, years, r) { const n = Math.round(years * 12); if (n <= 0 || m <= 0) return 0; const q = mr(r); return m * (1 - Math.pow(1 + q, -n)) / q; }
/* důchodový věk podle zákona (reforma 2024): ročník 1965 = 65 let, od ročníku 1966 o 1 měsíc za každý ročník, ročník 1989 a mladší 67 let
   (ženy s dětmi u ročníků do 1972 mívají nižší – pak zadej datum z IOLDP) */
function duchVek(rocnik) { if (rocnik <= 1965) return 65; if (rocnik >= 1989) return 67; return 65 + (rocnik - 1965) / 12; }
/* nemocenská 2026 (zák. 187/2006, redukční hranice 2026), čistá → hrubá odhadem */
const RH = [1633, 2449, 4897];
function netFromGross(g) { const soc = g * 0.071, zdr = g * 0.045, tax = Math.max(0, g * 0.15 - 2570); return g - soc - zdr - tax; }
function grossFromNet(n) { let lo = 0, hi = 1e6; for (let i = 0; i < 60; i++) { const m = (lo + hi) / 2; if (netFromGross(m) < n) lo = m; else hi = m; } return lo; }
/* PN zaměstnance (zák. 262/2006 a 187/2006, hranice 2026):
   1.–14. den náhrada mzdy od zaměstnavatele: průměrný hodinový výdělek redukovaný (285,78 / 428,58 / 856,98 Kč/h → 90/60/30 %), z toho 60 %, za neodpracované hodiny (10 směn × 8 h);
   od 15. dne nemocenská: DVZ = hrubý příjem za 12 měsíců / 365, redukce 1 633 / 2 449 / 4 897 Kč (90/60/30 %) nahoru na Kč,

const red3 = (x, H) => Math.min(x, H[0]) * 0.9 + Math.max(0, Math.min(x, H[1]) - H[0]) * 0.6 + Math.max(0, Math.min(x, H[2]) - H[1]) * 0.3;
function nemocenska(hruba) {
  const phv = hruba / (40 * 52 / 12), nahrHod = red3(phv, RHH) * 0.6, nahrada14 = Math.round(nahrHod * 80);
  const dvz = hruba * 12 / 365, red = Math.ceil(red3(dvz, RH) - 1e-9);
  const den60 = Math.ceil(red * 0.6 - 1e-9), den66 = Math.ceil(red * 0.66 - 1e-9), den72 = Math.ceil(red * 0.72 - 1e-9);
  return { phv, nahrHod, nahrada14, dvz, red, den60, den66, den72, d15: nahrada14 + 16 * den60, d31: 30 * den66, d61: 30 * den72 };
}
function pct100(vals) { const t = vals.reduce((a, b) => a + Math.max(0, b), 0); if (t <= 0) return vals.map(() => 0); const raw = vals.map(v => Math.max(0, v) / t * 100), fl = raw.map(Math.floor); let rest = 100 - fl.reduce((a, b) => a + b, 0); raw.map((r, i) => [r - fl[i], i]).sort((a, b) => b[0] - a[0]).slice(0, rest).forEach(([, i]) => fl[i]++); return fl; }

function get(o,p){return p.split(".").reduce((a,k)=>a==null?a:a[k],o)}
function set(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null)a[k]={};a=a[k]});a[ks.at(-1)]=v}
/* datum narození: píše se ručně (1.5.1990, 01.05.1990, 01051990), ukládá se ISO RRRR-MM-DD */
const dmyShow=iso=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||"");return m?m[3]+"."+m[2]+"."+m[1]:""};
function dmyParse(t){const s=String(t||"").trim();let r=/^(\d{1,2})\s*[.\/\-\s]\s*(\d{1,2})\s*[.\/\-\s]\s*(\d{4})$/.exec(s)||/^(\d{2})(\d{2})(\d{4})$/.exec(s);if(!r)return null;
  const d=+r[1],m=+r[2],y=+r[3],D=new Date(y,m-1,d);if(D.getFullYear()!==y||D.getMonth()!==m-1||D.getDate()!==d||y<1900||D>new Date())return null;
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0")}
function dmyMask(t){const d=String(t).replace(/\D/g,"").slice(0,8);let o=d.slice(0,2);if(d.length>=2)o+=".";if(d.length>2)o+=d.slice(2,4);if(d.length>=4)o+=".";if(d.length>4)o+=d.slice(4,8);return o}
function dmyLive(t){t=String(t).replace(/\.{2,}/g,".");if(/[^\d.]/.test(t)||/(^|\.)\d\./.test(t))return t;const m=dmyMask(t.replace(/\D/g,""));return m.length>=t.length?m:t}
const dmyInput=(p,v)=>`<input data-p="${p}" data-dmy="1" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="DD.MM.RRRR" value="${esc(dmyShow(v))}">`;

$("#cli").onchange=e=>{DB.cur=e.target.value;applyProdDef(inp());save();cur=0;renderEditor();update()};
const blank=()=>({klient:{titul:"",jmeno:"Nový klient",narozen:"",duchod:"",zam:0,podnik:0,pasiv:0,pronajem:0,bonus:0,vydaje_osobni:0,vydaje_dom:"",inv1:0,inv2:0,inv3:0,vdovsky:0,sirotci:0,hruba:"",bez_partnera:false},partner:{zapnuto:false},deti:[],motivace:"",vydaje:{celkem:0,splatky:0,pojistne:0,sporeni:0,vcetne:true},docasne:[],majetek:[],nefin:[],uvery:[],cile:[],renta:{mesicne:0,od_veku:""},pojisteni:{stavajici:0,navrh:0},realokace:{rucne:false,polozky:[]}});

  if(!d.klient)throw new Error("není to soubor plánu ani dotazník");const id="c"+Date.now();DB.clients[id]=d;DB.cur=id;save();renderClients();renderEditor();update()}catch(err){alert("Import se nepovedl: "+err.message)}e.target.value=""};
/* ---------------- vstupní dotazník (dotaznik.html) ---------------- */
/* soubor od klienta: doplní jen to, co klient vyplnil (prázdné nepřepisuje); seznamy (děti, majetek, úvěry, cíle…) nahradí, když je klient vyplnil */
function mergeDz(I,D){let n=0;const val=v=>v!==""&&v!=null&&!(typeof v==="number"&&isNaN(v));
  const obj=(path)=>{const src=get(D,path);if(!src||typeof src!=="object")return;Object.entries(src).forEach(([k,v])=>{if(typeof v==="object"&&v!==null)return;if(typeof v==="boolean"){if(k==="zapnuto"&&!v)return;if(k==="vs")return}if(val(v)){set(I,path+"."+k,v);n++}})};
  ["klient","partner","kontakt","renta","renta2","pojisteni.zivotni","fin","hypo","vydaje"].forEach(obj);
  /* sporty (seznam) u osob – nahradí se, když je klient vyplnil */
  ["klient","partner"].forEach(k=>{const L=((D[k]||{}).sporty||[]).filter(r=>r&&String(r.nazev||"").trim());if(L.length){I[k]=I[k]||{};I[k].sporty=JSON.parse(JSON.stringify(L));n+=L.length}});
  ["motivace","poznamka"].forEach(k=>{if(val(D[k])){I[k]=D[k];n++}});
  const keep={deti:r=>r.jmeno||r.narozen,docasne:r=>r.nazev||r.typ||+r.castka,majetek:r=>+r.hodnota||+r.vklad||+r.zam_prisp,nefin:r=>+r.hodnota||r.nazev,uvery:r=>+r.zustatek||+r.splatka,cile:r=>r.nazev||+r.castka};
  Object.entries(keep).forEach(([k,f])=>{const L=(D[k]||[]).filter(f);if(L.length){I[k]=JSON.parse(JSON.stringify(L));n+=L.length}});
  if(I.partner&&I.partner.zapnuto&&I.klient)I.klient.bez_partnera=false;
  return n}
$("#bDz").onclick=()=>{
  const ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;z-index:200;background:var(--bg)";
  const fr=document.createElement("iframe");fr.src="dotaznik.html?v=22#fp";fr.title="Vstupní dotazník";fr.style.cssText="border:0;width:100%;height:100%;display:block";
  ov.append(fr);document.body.append(ov);
  const close=()=>{removeEventListener("message",on);ov.remove();renderClients();renderEditor();update()};
  const on=e=>{if(e.origin!==location.origin||e.source!==fr.contentWindow||!e.data)return;const d=e.data;
    if(d.type==="dz:ready")fr.contentWindow.postMessage({type:"dz:init",plan:inp(),dz:DZLINK},location.origin);
    else if(d.type==="dz:change"&&d.plan&&d.plan.klient){DB.clients[DB.cur]=JSON.parse(JSON.stringify(d.plan));save();if(d.close)close()}};
  addEventListener("message",on)};
/* ---------------- shrnutí plánu e-mailem ----------------
   Oslovení podle titulu a pádu (jako šablony v Pipeline), následné kroky z realokace (zřízení produktu + trvalý příkaz), ŽP a převodu PP→DPS;
   termín elektronického podpisu z kalendáře (událost „VK: Příjmení podpis“). Odesílá se přes poštovního klienta (mailto) – nic nejde na server. */
let MAILCFG={rez:"",podpis:null};
const M_TITLES=[[/^prof\.?$/i,"profesore","profesorko",5],[/^doc\.?$/i,"docente","docentko",4],[/^(judr|mudr|phdr|rndr|paeddr|mvdr|pharmdr|thdr|phmr|dr)\.?$/i,"doktore","doktorko",3],[/^ing\.?$/i,"inženýre","inženýrko",2],[/^mgr\.?$/i,"magistře","magistro",2],[/^(bc|ba|bsc|mba|ph\.?d|csc|dis|llm|msc)\.?,?$/i,null,null,0]];
function mParseName(full){const parts=(full||"").replace(/,/g," ").split(/\s+/).filter(Boolean);let title=null,words=[];
  parts.forEach(w=>{const T=M_TITLES.find(t=>t[0].test(w)||t[0].test(w.replace(/\.$/,"")));if(T){if(T[1]&&(!title||T[3]>title[3]))title=T}else words.push(w)});
  const sur=words[words.length-1]||"",first=words.length>1?words[0]:"",fem=/(ová|á)$/i.test(sur)||(/a$/i.test(first)&&!/^(nikola|sáva|jiří)$/i.test(first)&&!/[ýí]$/.test(sur));
  return {title,first,sur,fem}}
function mVocSur(s){if(!s)return "";const l=s.toLowerCase();
  if(/[ýí]$/.test(l))return s; if(/a$/.test(l))return s.slice(0,-1)+"o"; if(/ek$/.test(l))return s.slice(0,-2)+"ku"; if(/ec$/.test(l))return s.slice(0,-2)+"če";
  if(/[kgh]$/.test(l)||/ch$/.test(l))return s+"u"; if(/[šžčřcjťďň]$/.test(l))return s+"i"; if(/[bcdfhlmnprstvz]r$/.test(l))return s.slice(0,-1)+"ře";
  if(/e$/.test(l)||/[ouy]$/.test(l))return s; return s+"e"}
function mSalut(full){const p=mParseName(full);if(p.title)return (p.fem?"paní ":"pane ")+(p.fem?p.title[2]:p.title[1]);if(!p.sur)return "";return p.fem?"paní "+p.sur:"pane "+mVocSur(p.sur)}
const visG=re=>FR.some(f=>re.test(f.g)&&!f.skip);
const vyjmenuj=a=>a.length<2?a.join(""):a.slice(0,-1).join(", ")+" a "+a.at(-1);
/* název produktu ve 2. pádě („Zřízení akciového portfolia Conseq“) */
function prodGen(n){const dip=/DIP/.test(n),b=n.replace(/\s*(–|-)\s*DIP\b|\s*\(DIP\)/g,"").trim(),M=[[/^ZFPI Realitní fond$/i,"realitního fondu ZFPI"],[/^Conseq akciové portfolio$/i,"akciového portfolia Conseq"],[/^Conseq dluhopisové portfolio$/i,"dluhopisového portfolia Conseq"],[/^Doplňkové penzijní spoření.*$/i,"doplňkového penzijního spoření"],[/^Spořicí účet$/i,"spořicího účtu"]];
  const m=M.find(x=>x[0].test(b));return (m?m[1]:b)+(dip?" (DIP)":"")}
const DNY_V=["v neděli","v pondělí","v úterý","ve středu","ve čtvrtek","v pátek","v sobotu"],VE_H=new Set([0,2,3,4,12,13,14,20,21,22,23]);
function kdyTxt(d,now=new Date()){const day=x=>{const y=new Date(x);y.setHours(0,0,0,0);return y},dd=Math.round((day(d)-day(now))/864e5);
  const mon=x=>{const y=day(x);y.setDate(y.getDate()-((y.getDay()+6)%7));return y},wk=Math.round((mon(d)-mon(now))/(7*864e5));
  const cas=(VE_H.has(d.getHours())?"ve ":"v ")+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
  const den=dd===0?"dnes":dd===1?"zítra":wk===0?"tento týden "+DNY_V[d.getDay()]:wk===1?"příští týden "+DNY_V[d.getDay()]:DNY_V[d.getDay()]+" "+d.getDate()+". "+(d.getMonth()+1)+".";
  return den+" "+cas}
function mailCompose(){
  const I=inp(),P=R.persons,noIns=!!((I.nastaveni||{}).bez_pojisteni);
  const osl=P.map(p=>mSalut((p.titul?p.titul+" ":"")+p.jmeno)).filter(Boolean);
  const K=[];
  /* oddělené finance: kroky za každého zvlášť (jménem) */
  (R.odd?R.odd.map(o=>[o.jmeno.split(" ")[0]+": ",o.R]):[["",R]]).forEach(([pre,RR])=>RR.pozice.filter(p=>p.jednor>0.5||p.mesicne>0.5).sort((a,b)=>(b.mesicne*120+b.jednor)-(a.mesicne*120+a.jednor)).forEach(p=>{
    K.push(pre+`Zřízení ${prodGen(p.nazev)}`+(p.jednor>0.5?` + jednorázový vklad ${kc(p.jednor)}`:"")+(p.mesicne>0.5?` + nastavení trvalého příkazu na ${kc(p.mesicne)}`:""))}));
  const zpVis=!noIns&&R.pojNove>0&&visG(/^(zp\d|deti)$/);
  if(zpVis){const ma=(R.poj&&R.poj[0]&&R.poj[0].stav>0)||(I.majetek||[]).some(a=>/Životní pojištění/.test(a.typ||""));
    K.push(ma?"Zrušení aktuálního životního pojištění – realizace nového":"Sjednání životního pojištění")}
  if((R.odd?R.odd.map(o=>o.R):[R]).some(RR=>RR.transakce.some(t=>t.bezpoplatku)))K.push("Převod PP na DPS");
  const L=[`Dobrý den${osl.length?", "+vyjmenuj(osl):""},`,"","posílám shrnutí finančního plánu, který jsme spolu prošli, ať máte vše podstatné po ruce."];
  if(K.length)L.push("","Následné kroky",...K);
  const pd=MAILCFG.podpis&&MAILCFG.podpis.start?new Date(MAILCFG.podpis.start):null;
  L.push("",pd&&!isNaN(pd)?`${(s=>s.charAt(0).toUpperCase()+s.slice(1))(kdyTxt(pd))} bych se Vám ozval telefonicky ohledně elektronického podpisu (záležitost 15 minut).`:"Ohledně elektronického podpisu (záležitost 15 minut) se Vám ozvu telefonicky.");
  return L.join("\n")}
function openMail(){if(!R)return;
  const I=inp(),K=I.kontakt=I.kontakt||{};
  const ov=document.createElement("div");ov.className="mailov";
  ov.innerHTML=`<div class="mailbox" role="dialog" aria-label="Shrnutí mailem"><div class="mh"><b>✉️ Shrnutí plánu mailem</b><span class="sp"></span><button class="btn" data-a="x">✕</button></div>
   <label class="f">Komu<input type="email" id="mTo" placeholder="email@klienta.cz" value="${esc(K.email||"")}"></label>
   <label class="f">Předmět<input type="text" id="mSub" value="Shrnutí finančního plánu"></label>
   <textarea id="mTxt" spellcheck="true"></textarea>
   <div class="matt" id="mAtt">📎 Připravuju přílohu PowerPoint…</div>
   <div class="hint">${MAILCFG.podpis?"Termín podpisu je z kalendáře (VK: … podpis).":"V kalendáři není budoucí „VK: "+esc(mParseName(R.persons[0].jmeno).sur||"Příjmení")+" podpis“ – termín doplň ručně."} Podpis doplní Mail sám.</div>
   <div class="mf"><button class="btn" data-a="copy">Kopírovat text</button><span class="sp"></span><button class="btn pri" data-a="send">✉️ Poslat shrnutí mailem</button></div></div>`;
  document.body.append(ov);
  const ta=ov.querySelector("#mTxt"),to=ov.querySelector("#mTo"),sb=ov.querySelector("#mSub");ta.value=mailCompose();
  const close=()=>{ov.remove();removeEventListener("keydown",onKey)};const onKey=e=>{if(e.key==="Escape")close()};addEventListener("keydown",onKey);
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  ov.querySelector("[data-a=x]").onclick=close;
  ov.querySelector("[data-a=copy]").onclick=async e=>{const t=sb.value+"\n\n"+ta.value;try{await navigator.clipboard.writeText(t)}catch(err){ta.select();document.execCommand("copy")}e.target.textContent="✓ Zkopírováno";setTimeout(()=>e.target.textContent="Kopírovat text",1500)};
  /* příloha: PPTX se staví hned po otevření okna, ať je při kliknutí na Poslat hotová (sdílení souboru musí proběhnout hned po kliknutí) */
  const att=ov.querySelector("#mAtt");let file=null,fail=false;
  makePptx((i,n)=>{if(att.isConnected)att.textContent=`📎 Připravuju přílohu PowerPoint… ${i}/${n}`}).then(r=>{file=new File([r.blob],r.name,{type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    att.textContent=`📎 Příloha: ${r.name} (${Math.max(1,Math.round(r.blob.size/1024))} kB)`}).catch(err=>{console.error(err);fail=true;att.textContent="📎 Přílohu se nepodařilo vytvořit – mail půjde bez ní."});
  const canShare=f=>{try{return !!(f&&navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){return false}};
  ov.querySelector("[data-a=send]").onclick=async()=>{const v=to.value.trim();if(v&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){to.focus();to.style.outline="2px solid #d33";return}
    if(v&&v!==(K.email||"")){K.email=v;save()}
    if(!file&&!fail){att.textContent="📎 Příloha se ještě připravuje – chvilku počkej a klikni znovu.";return}
    const mailto=()=>{location.href="mailto:"+encodeURIComponent(v)+"?subject="+encodeURIComponent(sb.value)+"&body="+encodeURIComponent(ta.value)};
    /* Safari / iPhone: systémové sdílení → Mail s přílohou i textem (adresát se do sdílení předat nedá → zkopíruje se do schránky) */
    if(canShare(file)){try{if(v)navigator.clipboard&&navigator.clipboard.writeText(v).catch(()=>{});
        await navigator.share({files:[file],title:sb.value,text:ta.value});att.textContent="📎 Odesláno přes sdílení"+(v?" – adresu "+v+" máš ve schránce, vlož ji do pole Komu.":".");return}
      catch(err){if(err&&err.name==="AbortError")return}}
    /* jinde mailto přílohu neumí: PPTX se stáhne a otevře se koncept mailu – soubor přetáhni ze Stažených */
    if(file){dlBlob(file,file.name);att.textContent=`📎 ${file.name} je ve Stažených – přetáhni ho do mailu.`;setTimeout(mailto,900)}else mailto()};
  (to.value?ta:to).focus();ta.setSelectionRange(0,0);ta.scrollTop=0}
$("#bMail").onclick=openMail;
function boot(){applyProdDef(inp());renderClients();renderEditor();update()}
if(HOST){
  ["#cli","#bNew","#bDup","#bDel"].forEach(q=>$(q).style.display="none");
  const cb=document.createElement("button");cb.className="btn";cb.textContent="✕ Zavřít";cb.onclick=()=>{clearTimeout(saveT);parent.postMessage({type:"fp:save",plan:inp(),close:true},location.origin)};$(".top").prepend(cb);
  addEventListener("message",e=>{if(e.origin===location.origin&&e.source===parent&&e.data&&e.data.type==="fp:podpis"){MAILCFG.podpis=e.data.podpis||null;return}});
  addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==parent||!e.data||e.data.type!=="fp:init")return;
    const d=e.data,pl=d.plan&&d.plan.klient?d.plan:blank(),pf=d.prefill||{};if(!(d.plan&&d.plan.klient))pl.klient.jmeno="";
    /* údaje z Pipeline (jméno, narození, IOLDP) doplní prázdná pole; IOLDP z kalkulačky má přednost, když je novější */
    Object.entries(pf).forEach(([k,v])=>{if(v==null||v==="")return;if(pl.klient[k]==null||pl.klient[k]===""||pl.klient[k]===0||(d.ioldpNew&&/^(inv[123]|vdovsky|sirotci|duchod|starobni|ovz)$/.test(k)))pl.klient[k]=v});
    if(d.kontakt){pl.kontakt=pl.kontakt||{};Object.entries(d.kontakt).forEach(([k,v])=>{if(v&&!pl.kontakt[k])pl.kontakt[k]=v})}
    if(d.kurz){pl.nastaveni=pl.nastaveni||{};if(pl.nastaveni.eur_kurz==null||pl.nastaveni.eur_kurz==="")pl.nastaveni.eur_kurz=d.kurz}
    if(d.market)MARKET={models:d.market.models||[],hist:d.market.hist||{}};
    if(d.prodDef&&typeof d.prodDef==="object")PRODDEF=d.prodDef;
    if(d.dz&&d.dz.to&&d.dz.k)DZLINK={to:d.dz.to,k:d.dz.k};if(d.rez)MAILCFG.rez=String(d.rez);if(d.podpis)MAILCFG.podpis=d.podpis;
    hypoFromCalc(pl,d.hypo);
    DB={cur:"h",clients:{h:pl}};boot()});
  parent.postMessage({type:"fp:ready"},location.origin);
}else boot();
